# Served by nginx-unprivileged behind Traefik (TLS terminates there).
map $sent_http_content_type $cache_control {
    default                     "public, max-age=3600";
    ~*text/html                 "no-cache";
    ~*(css|javascript)          "public, max-age=31536000, immutable";
    ~*image/                    "public, max-age=2592000";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml application/xml application/json text/plain;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/xml application/json text/plain;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Aliases by habit.
    location = /privacy-policy { return 301 /privacy/; }
    location = /imprint        { return 301 /impressum/; }
    location = /manual         { return 301 /docs/; }
    location = /handbuch       { return 301 /docs/; }
    location = /documentation  { return 301 /docs/; }

    location / {
        try_files $uri $uri/ =404;
    }

    # The Mermaid diagrams of the manual carry inline styles. add_header here replaces the
    # server-level set, so the image-only policy repeats the other headers.
    location ~* \.svg$ {
        add_header Cache-Control $cache_control always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
