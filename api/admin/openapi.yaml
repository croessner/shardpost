          type: boolean
        scripts:
          type: array
          description: |
            The scripts that ran, in order, when the server runs global
            scripts around the account's own (`before/<name>`,
            `personal`, `after/<name>`). A script that does not keep the
            message ends the sequence.
          items:
            type: string
        failed_scripts:
          type: array
          description: Global scripts that failed and were skipped, with the error.
          items:
