openapi: 3.0.3
info:
  title: ShardPost Admin API
  version: 1.0.0
  description: |
    Internal administration interface of ShardPost (roadmap stage 8).
    Reachable only on the configured admin listeners: a Unix socket inside
    the pod (the peer's UID is the identity) and optionally TCP with mutual
    TLS (the client certificate is the identity). Every operation requires
    a role; roles are assigned to identities in the server configuration.
servers:
  - url: /
security: []
paths:
  /admin/v1/version:
    get:
      operationId: getVersion
      summary: Server version
      description: Requires the role `diagnose`.
      responses:
        "200":
          description: Version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/server:
    get:
      operationId: getServerStatus
      summary: Server status
      description: |
        Version, instance, start time, a fingerprint of the effective
        configuration (secrets excluded), whether the store answers and
        where the store's own namespaces live (`placement`: the index
        pool, or the system pool of `ceph.system_pool`, as the last
        placement check found it). Requires the role `diagnose`.
      responses:
        "200":
          description: Status of this server instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/auth/flush:
    post:
      operationId: flushAuthCache
      summary: Flush the auth cache
      description: |
        Drops the cached logins and lookups of one account — every entry
        whose login name, lookup name or canonical account is the given
        name, compared without regard to case — or, without an account
        (or with `*`), every entry. This server's cache is flushed before
        the answer; the flush is recorded in the cluster's flush log
        (object `auth-flush` in the admin namespace) and the other servers
        apply it when they are notified, at the latest after their next
        poll (60 seconds). The answer does not wait for them. Neither the
        Director's routing cache nor the Nauthilus cache is flushed.
        Requires the role `repair`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthFlushRequest"
      responses:
        "200":
          description: The cache of this server was flushed and the flush recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthFlush"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts:
    get:
      operationId: listAccounts
      summary: Accounts of the account directory, one page
      description: |
        Reads the account directory (no listing of a pool): every account
        that has a registry, and the public namespace, with its directory
        entry. The order is the directory's (shard, then account), not
        alphabetical; continue with `cursor` = `next` until `next` is
        absent. With `state` a page may hold fewer than `limit` items
        while `next` is present (at most ten times `limit` entries are
        read per page). Requires the role `diagnose` and the scope of all
        accounts (socket callers; mutual-TLS clients with `all_accounts`).
      parameters:
        - name: cursor
          in: query
          required: false
          description: Position `<shard>:<account>` from `next` of the previous page.
          schema:
            type: string
            maxLength: 400
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: state
          in: query
          required: false
          description: Only entries in this state (`active` or `purging`).
          schema:
            type: string
            pattern: "^(active|purging)$"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: getAccount
      summary: Account overview
      description: |
        Resolves the account through Nauthilus (canonical account) and
        shows its store state: whether mailboxes exist, quota usage and
        limit, import lock and protocol trace. Aliases are accepted here and
        report their canonical account; the store fields then describe
        the namespace under the given name. Reads only. Requires the role
        `diagnose`.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: listMailboxes
      summary: Mailboxes of an account, page by page
      description: |
        Mailboxes in name order with registry data and index header (one
        read per mailbox; message counts only in getMailbox). `after`
        continues after the `next` value of the previous page; `name`
        returns only the mailbox with that exact name. The account must be
        canonical. Requires the role `diagnose`.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: name
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMailbox
      summary: Create a mailbox
      description: |
        Creates the mailbox (parents are implicit). Repeating the request
        for an existing mailbox with the same special-use answers 200 with
        it (idempotent); a different special-use is a conflict (409). The
        account must be canonical. Requires the role `provision`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxCreate"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxSummary"
        "200":
          description: Existed already as requested.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxSummary"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    get:
      operationId: getMailbox
      summary: One mailbox in detail
      description: |
        Registry data, index header and counts over all messages (reads
        every index shard of the mailbox). Requires the role `diagnose`.
      responses:
        "200":
          description: The mailbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxDetail"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMailbox
      summary: Rename a mailbox or change its subscription
      description: |
        `name` renames the mailbox together with its children (INBOX
        cannot be renamed; an existing target is a conflict), `subscribed`
        sets the subscription. Renaming to the current name is a no-op.
        `If-Match` (the mailbox's ETag) makes the change conditional (412
        on mismatch). Requires the role `provision`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxUpdate"
      responses:
        "200":
          description: The mailbox after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxSummary"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/acl:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    get:
      operationId: getMailboxACL
      summary: ACL of a mailbox
      description: |
        The explicit entries (the owner has all rights implicitly and is not
        listed) and the ACL generation. Requires the role `diagnose`.
      responses:
        "200":
          description: The ACL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxACL"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/acl/{identifier}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/Identifier"
      - $ref: "#/components/parameters/IfMatch"
    put:
      operationId: setACLEntry
      summary: Change the rights of one identifier
      description: |
        `mode` replace sets the rights, add and remove change them
        relative to the current entry; the change is computed and stored
        in one versioned step on the server, so concurrent changes do not
        lose each other. `If-Match` is the ACL ETag (412 on mismatch).
        The identifier must be a canonical account or `anyone`, not the
        owner. The grantee's shared pointer follows. Requires the role
        `provision`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ACLChange"
      responses:
        "200":
          description: The ACL after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxACL"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteACLEntry
      summary: Remove the entry of one identifier
      description: Like setACLEntry with empty rights. Requires the role `provision`.
      responses:
        "200":
          description: The ACL after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxACL"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/acl/explain:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    get:
      operationId: explainMailboxACL
      summary: Why a principal can (not) use a mailbox
      description: |
        Resolves the principal to its canonical account, computes its
        effective rights with the same function IMAP uses (own entry plus
        "anyone") and checks the pointer in the principal's registry that
        makes the mailbox appear in the shared namespace. `findings` names
        every reason in plain text. Requires the role `diagnose`.
      parameters:
        - name: principal
          in: query
          required: true
          description: Account (or alias) whose access is explained.
          schema:
            type: string
            minLength: 1
            maxLength: 320
      responses:
        "200":
          description: The explanation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACLExplanation"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/quota:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: getQuota
      summary: Quota usage and limit
      description: |
        Stored usage counters and the effective limit (0 = unlimited).
        Requires the role `diagnose`.
      responses:
        "200":
          description: The quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/shared:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: listSharedMailboxes
      summary: Mailboxes of other accounts shared with this account
      description: |
        The pointers in the account's registry (the mailboxes of other
        accounts it sees, as "<owner>/<mailbox>").
        Requires the role `diagnose`.
      responses:
        "200":
          description: The pointers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedList"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/directory:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: getAccountDirectory
      summary: The account's directory entry
      description: |
        The account's entry in the account directory, whether its
        registry exists, and the state of the directory itself (shard
        count, phase, completion marker of the last backfill). Reads
        only; the account is not resolved through Nauthilus. Requires the
        role `diagnose`.
      responses:
        "200":
          description: The entry and the directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/directory/repair:
    parameters:
      - $ref: "#/components/parameters/Account"
    post:
      operationId: repairAccountDirectory
      summary: Repair the account's directory entry
      description: |
        Applies the repair rules of the account directory to one account.
        An entry the purge job left in the state `purging` (the job
        failed or was cancelled) while no purge job of that lock session
        still runs is removed when the account's registry is gone, and set
        back to `active` when the registry exists. An `active` entry older
        than ten minutes whose registry is missing is stale and removed
        (`stale_removed`). Any other entry is left as it is (action
        `none`; `purge_running` while the purge job still runs). The
        account is not resolved through Nauthilus: a purged account may
        no longer exist there. Requires the role `repair`.
      responses:
        "200":
          description: What was found and done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryRepair"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/submissions:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: listSubmissions
      summary: The account's delayed JMAP submissions
      description: |
        The delayed submissions (JMAP EmailSubmission with HOLDFOR or
        HOLDUNTIL) the account still holds a message copy for: pending,
        being sent, or ended and not yet cleaned up. Read from the
        account's intents and one record per submission, no listing; the
        account is not resolved through Nauthilus. Requires the role
        `diagnose`.
      responses:
        "200":
          description: The submissions, by release time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionList"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/submissions:
    get:
      operationId: listAllSubmissions
      summary: Every delayed JMAP submission record
      description: |
        The records of the delayed submission queue of every account, in
        key order, a page at a time. Unlike the per-account list it lists
        the admin namespace (one listing per page, visiting every
        placement group of the pool): a tool for diagnosis and for the
        check that the queue is empty before a rollback, not for
        routine use. It also finds a record whose message copy and queue
        entry are lost. Requires the role `diagnose` and the scope of
        all accounts.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: One page of records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionList"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/submissions/{submission}/cancel:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/SubmissionID"
    post:
      operationId: cancelSubmission
      summary: Cancel a pending delayed submission
      description: |
        Cancels a pending delayed submission as a JMAP client would
        (undoStatus canceled): the message is not sent, its copy is
        deleted, and the account's EmailSubmission shows `canceled`.
        Once the worker has begun to send it the cancel is refused with
        `conflict`; a submission that has ended and been cleaned up is
        `no_such_submission`. Requires the role `support`.
      responses:
        "200":
          description: The canceled submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/plans:
    parameters:
      - $ref: "#/components/parameters/Account"
    post:
      operationId: createPlan
      summary: Plan a maintenance job (dry run)
      description: |
        Computes what the job would do (target set, effects) and stores the
        plan; apply it with `POST /admin/v1/jobs` before it expires. Kinds
        and roles: `scrub`, `quota_recalc`, `acl_reconcile`, `fts_rebuild`,
        `fts_dict_convert`, `fts_layout`, `mailbox_name_convert`,
        `attachment_backfill` (role `repair`), `mailbox_delete`, `expunge`,
        `purge` (role `delete`). `fts_layout` with `layout: 3` needs the
        cluster mark (`POST /admin/v1/fts/layout3/enable`), `fts_layout`
        with `dict_filter: ids` the cluster mark of the dictionary filter
        (`POST /admin/v1/fts/dictfilter/enable`), `fts_layout` and
        `fts_rebuild` with `online: true` the cluster mark of online runs
        (`POST /admin/v1/fts/online/enable`); without them the plan
        is refused with `conflict` (409). `fts_dict_convert` is a
        legacy kind for layout 2 indexes written before 0.35.0; for an
        account whose index has layout 3 it is refused with `conflict`
        (409). A plan that changes other accounts (ACL repairs, purge)
        needs them in the client scope. The account must be canonical.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/plans:
    post:
      operationId: createBatchPlan
      summary: Plan a batch over all accounts (dry run)
      description: |
        Plans a batch job: `kind` run on every account of the account
        directory, one account after another with a bounded parallelism
        (`jobs.batch_parallel`, for scrub `scrub.parallel`). Kinds:
        `index_check` (role `diagnose`), `scrub`, `fts_rebuild`,
        `attachment_backfill`, `fts_layout` (role `repair`); the batch needs the role of
        its kind and the scope of all accounts (socket callers; mutual-TLS
        clients with `all_accounts`). An exclusive kind (`fts_rebuild`, `fts_layout`
        unless online) takes the maintenance lock per account; an account
        another job or an import holds (or, online, another run of the
        account is alive) is tried again at the end; online, an account
        without a layout 3 index counts as `unsupported`. A batch of
        `fts_layout` or `fts_rebuild` keeps the reshard window unless
        `anytime` is set. `skip_idle` (scrub
        only) skips the accounts that did not change since their last
        complete batch scrub found nothing, for at most
        `scrub.interval_days`. The plan's account is empty and its kind
        `batch`; apply it with `POST /admin/v1/jobs`. Refused with
        `conflict` (409) while the account directory has no completed
        backfill (`shardpost index backfill accounts`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchPlanRequest"
      responses:
        "201":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/plans/{plan}:
    parameters:
      - name: plan
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    get:
      operationId: getPlan
      summary: A plan
      description: Requires the role `diagnose`.
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/jobs:
    get:
      operationId: listJobs
      summary: Jobs, oldest first
      description: |
        Requires the role `diagnose`; a client with an account scope must
        name an account.
      parameters:
        - name: account
          in: query
          required: false
          schema:
            type: string
            maxLength: 320
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: submitJob
      summary: Apply a plan or start a check
      description: |
        With `plan_id` the plan is applied (once, before it expires; the
        apply refuses when the account drifted from the plan). Without
        it, `kind` `index_check` (role `diagnose`) checks the `account`
        read-only. The job runs on any server and survives restarts. A
        batch plan (`POST /admin/v1/plans`) becomes a job of the kind
        `batch` without account; its result counts the accounts (`done`,
        `skipped`, `gone`, `failed`, `findings`) and names the first 50
        that failed or had findings.
        `Idempotency-Key` returns the same job for a repeated request
        (200) and refuses the key for another request (409).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "200":
          description: The job of an earlier request with the same key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/jobs/{job}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getJob
      summary: A job with progress and result
      description: Requires the role `diagnose`.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/jobs/{job}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: cancelJob
      summary: Ask a job to stop
      description: |
        A queued job is cancelled at once, a running one at its next safe
        point (no rollback of what it did; a batch stops between two
        accounts). Requires the role of the kind (of a batch: of the kind
        it runs, and the scope of all accounts).
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    get:
      operationId: listMessages
      summary: Messages of a mailbox (metadata only), by UID
      description: |
        UID, GUID, size, flags, dates and MODSEQ, without headers or
        content. Page with `after_uid`. Requires the role `diagnose`.
      parameters:
        - name: after_uid
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/messages/{uid}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/UID"
      - $ref: "#/components/parameters/UIDValidity"
    get:
      operationId: getMessage
      summary: One message with envelope and header section
      description: |
        The message is named by mailbox id, UIDVALIDITY and UID, so a
        recreated mailbox cannot answer with another message (412).
        Requires the role `content`; the audit log records the
        identity, not the content.
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetail"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/messages/{uid}/raw:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/UID"
      - $ref: "#/components/parameters/UIDValidity"
    get:
      operationId: exportMessage
      summary: Export one message (RFC 5322)
      description: Requires the role `content`.
      responses:
        "200":
          description: The message as stored.
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/messages/flags:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    post:
      operationId: setMessageFlags
      summary: Add or remove flags
      description: |
        Changes the flags of the given UIDs like IMAP STORE (`\Recent`
        cannot be set). `uidvalidity` must match (412), UIDs that no
        longer exist are reported as missing, `unchanged_since`
        (CONDSTORE) skips messages changed since that MODSEQ. Requires the
        role `support`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagRequest"
      responses:
        "200":
          description: What changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/messages/copy:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    post:
      operationId: copyMessages
      summary: Copy or move messages to another mailbox of the account
      description: |
        Like IMAP COPY/MOVE with UIDPLUS: the result maps each source UID
        to its UID in the destination. `uidvalidity` must match (412).
        Requires the role `support`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyRequest"
      responses:
        "200":
          description: The copies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/search:
    parameters:
      - $ref: "#/components/parameters/Account"
    post:
      operationId: searchMessages
      summary: Bounded message search
      description: |
        Searches one mailbox or all mailboxes of the account. Criteria are
        ANDed; `from`, `to`, `subject` match case-insensitively as
        substrings of the envelope, `text` uses the full-text index
        (headers and body). At most `search.scan_limit` messages are
        examined per request; `next` continues a truncated search.
        Requires the role `content`; criteria values are not logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageSearch"
      responses:
        "200":
          description: The hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/export:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: exportAccount
      summary: Export the account as an archive
      description: |
        Streams the account as a versioned tar archive (format
        `shardpost-account-export` 1): per mailbox its identity, state,
        ACL, subscription, special-use and annotations, per message the
        message with UID, GUID, flags, MODSEQ, dates, POP3 UIDL and
        SHA-256, the Sieve scripts, and last a manifest with every entry's
        checksum. The export does not lock the account; messages that
        vanish meanwhile are listed as skipped. An export that fails midway
        ends with an incomplete manifest. Restore with `shardpostctl
        restore` (import API). Requires the role `export`.
      responses:
        "200":
          description: The archive.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/sieve:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: listSieveScripts
      summary: Sieve scripts of the account
      description: Names, sizes, versions and the active script. Requires the role `diagnose`.
      responses:
        "200":
          description: The scripts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveList"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/sieve/{name}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/ScriptName"
    get:
      operationId: getSieveScript
      summary: One Sieve script
      description: Requires the role `content`.
      responses:
        "200":
          description: The script.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveScript"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putSieveScript
      summary: Store (and optionally activate) a Sieve script
      description: |
        The script is compiled first; a script that does not compile is
        refused (400) and nothing is stored. `If-Match` is the script's
        ETag (`*`: must exist), `If-None-Match: *` creates only. The
        script `jmap-vacation` belongs to the JMAP VacationResponse and
        cannot be stored here (409). Requires the role `support`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            enum: ["*"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SievePut"
      responses:
        "200":
          description: The stored script.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveScript"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSieveScript
      summary: Delete an inactive Sieve script
      description: |
        The active script cannot be deleted (409), and neither can
        `jmap-vacation`, the script of the JMAP VacationResponse (409).
        Requires the role `support`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/sieve-active:
    parameters:
      - $ref: "#/components/parameters/Account"
    put:
      operationId: setActiveSieveScript
      summary: Activate a script or deactivate filtering
      description: |
        An empty name deactivates. `jmap-vacation`, the script of the
        JMAP VacationResponse, is never the active script (409).
        Requires the role `support`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SieveActivate"
      responses:
        "200":
          description: The scripts after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveList"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/sieve-check:
    parameters:
      - $ref: "#/components/parameters/Account"
    post:
      operationId: checkSieve
      summary: Compile a script and run it without side effects
      description: |
        Compiles `script` (or the stored script `name`, or the active
        one) with the account's includes and, when a message is given,
        runs it and reports the actions it would take. Nothing is
        executed: no redirect, vacation or notification is sent, no
        external program runs, no duplicate or vacation record is
        written, nothing is filed. A message from the store (`message`)
        requires the role `content`, otherwise `diagnose`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SieveCheck"
      responses:
        "200":
          description: The result (also for a script that does not compile).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveCheckResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/learning:
    get:
      operationId: listLearningJobs
      summary: Learning queue (IMAPSieve learning programs)
      description: |
        Requires the role `diagnose`; a client with an account scope must
        name an account.
      parameters:
        - name: account
          in: query
          required: false
          schema:
            type: string
            maxLength: 320
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LearningState"
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: One page, by job id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPage"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/learning/{job}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getLearningJob
      summary: One learning job
      description: Requires the role `diagnose`.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningJob"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/learning/{job}/retry:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: retryLearningJob
      summary: Retry a dead learning job
      description: |
        Only dead jobs are retried. Learning programs are not idempotent
        (a message learned twice counts twice): a job that was already
        attempted needs `confirm_repeat`. A job whose message was never
        committed (no receipt) cannot be retried. Requires the role
        `repair`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningRetry"
      responses:
        "200":
          description: The job, due now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningJob"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/deliveries:
    post:
      operationId: deliver
      summary: Local delivery (LDA)
      description: |
        Delivers one message to one recipient like a local delivery agent:
        the recipient is resolved like an LMTP recipient, the user's Sieve
        script runs (unless disabled or a mailbox is given) and the message
        is stored all or nothing. Redirect, vacation and notify behave as
        for LMTP. Requires the role `deliver`; `enforce_quota=false` also
        requires `deliver:noenforce` (the usage is still counted).
      parameters:
        - name: recipient
          in: query
          required: true
          description: Envelope recipient (address or account).
          schema:
            type: string
            minLength: 1
            maxLength: 320
        - name: from
          in: query
          required: false
          description: Envelope sender; empty is the null sender.
          schema:
            type: string
            maxLength: 320
        - name: mailbox
          in: query
          required: false
          description: Store directly into this existing mailbox; Sieve does not run.
          schema:
            type: string
            maxLength: 1024
        - name: sieve
          in: query
          required: false
          description: Run the user's Sieve script.
          schema:
            type: boolean
            default: true
        - name: enforce_quota
          in: query
          required: false
          description: Refuse the message when it does not fit the quota.
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Delivered (or discarded by Sieve).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import:
    parameters:
      - $ref: "#/components/parameters/Account"
    post:
      operationId: openImport
      summary: Open or renew an import session
      description: |
        Takes the account's import lock for the session (or renews it).
        While the lock is held, IMAP, POP3, ManageSieve, LMTP and local
        delivery refuse the account temporarily. The account must be the
        canonical account the recipient lookup resolves it to. The lock
        expires after the configured TTL unless renewed; every import
        call renews it. Requires the role `import`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSessionRequest"
      responses:
        "200":
          description: The session holds the lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSession"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: closeImport
      summary: Release the import lock
      parameters:
        - $ref: "#/components/parameters/ImportSessionHeader"
      responses:
        "204":
          description: Released (or not held by this session).
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/ImportSessionHeader"
    get:
      operationId: listImportMailboxes
      summary: Mailboxes of the account with their identity state
      responses:
        "200":
          description: All mailboxes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMailboxList"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putImportMailbox
      summary: Create or adopt a mailbox with the source identity
      description: |
        Creates the mailbox with the source UIDVALIDITY (and the source
        mailbox id if it is 32 hex digits and unused), or adopts an
        existing one with the same UIDVALIDITY. An existing mailbox with
        the source id under another name is renamed. An existing empty
        mailbox with another UIDVALIDITY is replaced; a non-empty one is
        a conflict unless `replace` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportMailboxSpec"
      responses:
        "200":
          description: The mailbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMailboxState"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    delete:
      operationId: deleteImportMailbox
      summary: Delete a mailbox that no longer exists in the source
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    get:
      operationId: listImportMessages
      summary: Inventory of a mailbox (UID order, paged)
      parameters:
        - name: after
          in: query
          required: false
          description: Only UIDs above this one.
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 4294967295
        - name: limit
          in: query
          required: false
          description: Page size (bounded by the server).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: One page; `next_after` is set when more may follow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportInventory"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: importMessages
      summary: Store messages at their source UIDs
      description: |
        The body is `multipart/mixed`; every part is `message/rfc822` and
        carries its identity as JSON in the part header `X-Import-Meta`
        (uid, modseq, flags, internal_date, save_date, guid, pop3_uidl).
        UIDs must be ascending. A UID that already holds a message of the
        same size is skipped (resuming a run); one with a different
        message is a conflict. Quota usage is counted, not enforced.
      requestBody:
        required: true
        content:
          multipart/mixed:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/changes:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    post:
      operationId: importChanges
      summary: Apply source flag changes and expunges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportChanges"
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMailboxState"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/finalize:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    post:
      operationId: finalizeImportMailbox
      summary: Set UIDNEXT and HIGHESTMODSEQ to the source values
      description: |
        UIDNEXT and HIGHESTMODSEQ become at least the source values; the
        change log starts after HIGHESTMODSEQ, so clients resuming from a
        source state get complete answers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFinalize"
      responses:
        "200":
          description: The resulting state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMailboxState"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/acl:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    put:
      operationId: putImportACL
      summary: Replace the explicit ACL entries of a mailbox
      description: Identifiers not listed lose their rights; the owner is implicit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportACL"
      responses:
        "204":
          description: Replaced.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/readers/{reader}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/Reader"
      - $ref: "#/components/parameters/ImportSessionHeader"
    put:
      operationId: putImportReader
      summary: Set an account's own reading state of a public folder
      description: |
        Only for the public namespace (`~public`). `\Seen` is private
        per account there: the import stores the source user's state as
        the shared default, and this call records where the reader
        differs from what the reader sees now, so the reader's `\Seen`
        becomes exactly `seen`. UIDs the mailbox does not hold are
        ignored. The marks are written in batches, each under a new
        MODSEQ of the mailbox, as an IMAP STORE does. The caller's scope
        has to cover the reader as well as `~public`. `subscribed`, if given, sets the reader's
        subscription of the folder. The call is repeatable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportReader"
      responses:
        "200":
          description: What changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReaderResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/metadata:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    put:
      operationId: putImportMetadata
      summary: Replace the annotations (METADATA) of a mailbox
      description: |
        Entry names are full (`/shared/comment`, `/private/comment`);
        private entries belong to the account. Entries not listed are
        removed. Entries under `/private/vendor/shardpost/jmap/` are
        kept by the server and refused (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportMetadata"
      responses:
        "204":
          description: Replaced.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/sieve:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/ImportSessionHeader"
    put:
      operationId: putImportSieve
      summary: Replace the Sieve scripts and the active script
      description: |
        Stores the scripts as given (nothing is executed), activates
        `active` ("" deactivates) and removes scripts not listed — except
        `jmap-vacation`, the server's copy of the JMAP VacationResponse,
        which stays; a set that names it is refused (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSieve"
      responses:
        "204":
          description: Replaced.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/servers:
    get:
      operationId: listServers
      summary: Process registrations
      description: |
        The registrations of the processes that use the store: every
        server, the JMAP push worker, scrubs, backfills and sweeps
        register at startup and then every minute (`servers/<instance>`
        in the admin store) with their role and system pool, and record
        their orderly end (`stopped_at`). A registration seen within
        three minutes and not stopped is fresh; one not renewed for 24
        hours is deleted. Reading the registrations lists the admin
        namespace when `admin.kv_index` is not `read`. Requires the role
        `diagnose`.
      responses:
        "200":
          description: The registrations, by instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerRegistrationList"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/fts/layout3:
    get:
      operationId: getFTSLayout3
      summary: Layout 3 of the full-text index in the cluster
      description: |
        Whether the cluster mark that allows layout 3 is set, and the
        server registrations: every server since 0.45.0 registers at
        startup and then every minute (`servers/<instance>` in the admin
        store); a registration seen within three minutes is fresh, one not
        renewed for 24 hours is deleted. Reading the registrations lists
        the admin namespace when `admin.kv_index` is not `read`. Requires
        the role `diagnose`.
      responses:
        "200":
          description: The mark and the registrations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayout3Status"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/fts/layout3/enable:
    post:
      operationId: enableFTSLayout3
      summary: Allow layout 3 in the cluster
      description: |
        Sets the cluster mark after checking that exactly `pods` fresh
        registrations of servers (role `serve`, or no role: before
        0.47.0) report the capability `fts_layout3`; the push worker,
        scrubs and backfills are not counted. Servers before 0.45.0 do
        not register, so the expected number of pods is the check. A pod
        replaced less than three minutes ago without recording its end
        leaves its predecessor's record fresh; wait and try again. `force` skips the
        check (recorded in the audit log and in the mark). With the mark,
        servers with `fts.layout: 3` (the default since 0.46.0) create new
        indexes in layout 3 and `fts_layout` jobs may convert to it.
        Refused with `conflict` (409)
        when the registrations do not match. Requires the role `repair`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FTSLayout3Enable"
      responses:
        "200":
          description: The mark is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayout3Status"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/fts/layout3/disable:
    post:
      operationId: disableFTSLayout3
      summary: Remove the layout 3 mark
      description: |
        Removes the cluster mark, so that no new layout 3 index is
        created; waits five seconds (creators read the mark when they
        create) and then reads the presence index of the accounts that
        still have a layout 3 index. A downgrade to a version before
        0.45.0 is possible only when that list is empty: convert the
        accounts back with `fts_layout` `layout: 2` first. Requires the
        role `repair`.
      responses:
        "200":
          description: The mark is gone; the accounts that still have layout 3.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayout3Disable"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/fts/dictfilter:
    get:
      operationId: getFTSDictFilter
      summary: The dictionary filter mark of the full-text index
      description: |
        Whether the cluster mark of the dictionary filter
        (`fts/dictfilter`, since 0.50.0) is set, and the server
        registrations as for layout 3. The mark allows index
        generations that a version before 0.50.0 must not search: with
        the identifier filter of the substring dictionary
        (`fts.dict_filter: ids`) and with the text preparation without
        the signature and trace fields of attached headers
        (`fts.attached_headers: nosig`). Without it new generations get
        neither, whatever the configuration says. Requires the role
        `diagnose`.
      responses:
        "200":
          description: The mark and the registrations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayout3Status"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/fts/dictfilter/enable:
    post:
      operationId: enableFTSDictFilter
      summary: Allow the dictionary filter in the cluster
      description: |
        Sets the cluster mark of the dictionary filter after checking
        that exactly `pods` fresh registrations of servers report the
        capability `fts_dict_filter` (since 0.50.0); otherwise as the
        layout 3 mark. With the mark, new generations (fresh indexes,
        rebuilds, `fts_layout` jobs) get the identifier filter of
        `fts.dict_filter` and the text preparation of
        `fts.attached_headers`; existing ones change with `fts_layout`
        (filter) or `fts_rebuild` (text preparation). Refused with
        `conflict` (409) when the registrations do not match. Requires
        the role `repair`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FTSLayout3Enable"
      responses:
        "200":
          description: The mark is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayout3Status"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/fts/dictfilter/disable:
    post:
      operationId: disableFTSDictFilter
      summary: Remove the dictionary filter mark
      description: |
        Removes the cluster mark of the dictionary filter, so that no
        new generation gets the identifier filter or the text
        preparation `nosig`; waits five seconds (creators read the mark
        when they create) and then lists the accounts whose entry in the
        layout 3 presence index says that a generation of theirs has
        either (`props`: set before such a generation is created,
        cleared after the account switched to one without, kept in step
        by the scrub) — the presence index alone, as the layout 3
        disable reads it. A downgrade to a version before 0.50.0 is
        possible only when that list is empty: convert them with
        `fts_layout` `dict_filter: none` and rebuild those with `nosig`
        with `fts_rebuild` first. Requires the role `repair`.
      responses:
        "200":
          description: The mark is gone; the accounts whose index still has the filter or the text preparation nosig.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayout3Disable"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/fts/online:
    get:
      operationId: getFTSOnline
      summary: The mark of online runs of the full-text index
      description: |
        Whether the cluster mark of online runs (`fts/online`, since
        0.51.0) is set, and the server registrations as for layout 3.
        The mark allows `fts_layout` and `fts_rebuild` jobs to run
        without the account's maintenance lock: deliveries, logins and
        sessions go on while the index is resharded or rebuilt beside
        the current generation, and a single compare-and-swap switches
        to it. Without the mark every run is offline, as before 0.51.0.
        Requires the role `diagnose`.
      responses:
        "200":
          description: The mark and the registrations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayout3Status"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/fts/online/enable:
    post:
      operationId: enableFTSOnline
      summary: Allow online runs of the full-text index
      description: |
        Sets the cluster mark of online runs after checking that exactly
        `pods` fresh registrations of servers report the capability
        `fts_online_build` (since 0.51.0); otherwise as the layout 3
        mark. A server before 0.51.0 does not record what it indexes
        for an online run and waits at its freeze (a temporary failure
        after `fts.frozen_wait_seconds`), so every server must know it
        first. Refused with `conflict` (409) when the registrations do
        not match. Requires the role `repair`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FTSLayout3Enable"
      responses:
        "200":
          description: The mark is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayout3Status"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/fts/online/disable:
    post:
      operationId: disableFTSOnline
      summary: Remove the mark of online runs
      description: |
        Removes the cluster mark of online runs: new plans of
        `fts_layout` and `fts_rebuild` run offline (`online: true` is
        refused with `conflict`), a planned online run that has not
        started ends without a change (`deferred: mark_off`, not a
        failed job). Runs that already started finish;
        before a downgrade to a version before 0.51.0 wait until no
        account shows an online run (`next_online` in the layout state)
        or clear it with `POST
        /admin/v1/accounts/{account}/fts/layout/clear`. Requires the
        role `repair`.
      responses:
        "200":
          description: The mark is gone; the registrations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayout3Status"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/fts/layout3/accounts:
    get:
      operationId: listFTSLayout3Accounts
      summary: The accounts with a layout 3 index
      description: |
        The presence index `ix.fts_layout`: every account that has (or is
        being converted to) a layout 3 index, entered before its layout 3
        objects are created and removed after a conversion back to layout
        2. With `verify` each account's layout record is read and an entry
        whose account has no layout 3 index is marked; the shapes show
        the identifier filter (`dict_id_min_runes`) and the text
        preparation (`attached_headers`) of each generation. Requires
        the role `diagnose` and the scope of all accounts.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 320
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
        - name: verify
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayoutAccountPage"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/fts/layout:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: getFTSLayout
      summary: The layout of the account's full-text index
      description: |
        The layout record of the account's index: the current generation
        (layout 2 without a record), a conversion in progress (`next`,
        with the token of its run) and sources a conversion has not
        removed yet (`old`). One read; the account is not resolved through
        Nauthilus. Requires the role `diagnose`.
      responses:
        "200":
          description: The layout record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayoutState"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/fts/layout/clear:
    parameters:
      - $ref: "#/components/parameters/Account"
    post:
      operationId: clearFTSLayout
      summary: Remove an unfinished conversion
      description: |
        Removes the conversion in progress of the account's full-text
        index when its run has ended: a job that is not running any more,
        or an import reshard whose heartbeat is older than 90 seconds. Its
        freeze is lifted (only the freeze of exactly that run), its
        target objects deleted. A conversion whose run still works is
        left alone. Sources an ended run left behind after its switch
        (the record's `old`) are deleted as well. The fallback for a run
        that could not clean up; the jobs scrub does the same. Requires
        the role `repair`.
      responses:
        "200":
          description: What was cleared ("" for nothing) and the record after.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSLayoutClear"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/fts/stats:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: getFTSStats
      summary: Key counts of the account's full-text index
      description: |
        Without parameters the counters of the posting objects (`!n`,
        `!dn`) and the document count `c` of a layout 3 index: S + 1
        reads, no lock (a layout 2 index has no counters; use `exact`).
        There is no counter per dictionary or header object. `exact`
        counts the keys of every object page by page instead (librados
        has no key count, and the client library no read of keys alone,
        so the values come along: about the account's whole index omap
        is transferred, posting lists and header texts included): on a
        large account thousands of reads alongside the deliveries,
        `parallel` objects at a time (default 1, for a test account 2;
        at most 16), the counts only roughly consistent; bounded by the
        5 minute write timeout of the admin listener. `classes`
        classifies the terms by field, class and length and projects
        the dictionary keys of the identifier rule for every bound 13
        to 40 (a body term with letters and digits of at least n runes
        counted as one key): only for the test accounts the server's
        `fts.stats_test_accounts` names, otherwise refused with
        `forbidden` (403). The answer never contains a term. Requires
        the role `diagnose` (since 0.49.0).
      parameters:
        - name: exact
          in: query
          required: false
          schema:
            type: boolean
        - name: parallel
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 16
        - name: classes
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FTSStats"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/fts-reshard:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/ImportSessionHeader"
    post:
      operationId: startImportReshard
      summary: Reshard the full-text index between import batches
      description: |
        Checks the key counts of the account's layout 3 index (one read per
        object) and reshards it under the import session when they ask for
        more objects, without leaving the import lock: a `fts_layout` job
        would wait for the import to end. The run waits
        `jobs.settle_seconds` first, works synchronously up to
        `fts.import_reshard_sync_seconds` and then answers 202 and goes on
        in the background, renewing the import lock and its heartbeat every
        30 seconds. A second POST of the session while its run is active
        answers 202 without starting another; one while another run (other
        session) has a heartbeat younger than 90 seconds answers `conflict`
        (409); an older one is cleared and replaced. Import batches of the
        session answer `conflict` (409) while its reshard runs. `g` is the
        index generation at the answer: it changes when a reshard
        switched. Requires the role `import`.
      responses:
        "200":
          description: Nothing to do (`idle`), or the reshard finished (`done`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReshard"
        "202":
          description: The reshard goes on in the background (`running`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReshard"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: getImportReshard
      summary: State of the import reshard
      description: |
        `running`, `done` or `failed` (with `error`) from this server's
        runs; without one (another server, a restart) from the layout
        record: a conversion of the session with a heartbeat younger than
        90 seconds is `running`, an older one `failed`, otherwise `idle`.
        `g` is the current index generation. Requires the role `import`.
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReshard"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/trace:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: getTrace
      summary: Protocol trace switch of an account
      description: The account must be the canonical account. Requires the role `trace`.
      responses:
        "200":
          description: The current switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceStatus"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setTrace
      summary: Switch the protocol trace on
      description: |
        Switches the protocol trace of the account on for a bounded time
        (the configured default without `duration_seconds`, at most the
        configured maximum). Every server of the cluster traces new
        sessions of the account after their authentication: each protocol
        line of both directions is logged (event `protocol_trace`) with the
        session id; literal contents only by size, long lines cut. Running
        sessions of the account are not affected until they log in again.
        Authentication commands end the trace unlogged; PREVIEW texts are
        masked. The account must be the canonical account. Requires the
        role `trace`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraceRequest"
      responses:
        "200":
          description: The trace is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceStatus"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearTrace
      summary: Switch the protocol trace off
      description: |
        Removes the switch; a traced session stops at its next command once
        the configured recheck interval has passed (an idling session at
        the end of IDLE or when the trace expires). Requires the role
        `trace`.
      responses:
        "204":
          description: Off (or it was not on).
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    Account:
      name: account
      in: path
      required: true
      description: Canonical account.
      schema:
        type: string
        minLength: 1
        maxLength: 320
    SubmissionID:
      name: submission
      in: path
      required: true
      description: Id of a JMAP EmailSubmission.
      schema:
        type: string
        pattern: "^S[0-9a-f]{1,63}$"
    MailboxID:
      name: id
      in: path
      required: true
      description: Stable mailbox id.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ImportSessionHeader:
      name: X-Import-Session
      in: header
      required: true
      description: The session that holds the import lock.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{16,64}$"
    Reader:
      name: reader
      in: path
      required: true
      description: Canonical account that reads the public folder.
      schema:
        type: string
        minLength: 1
        maxLength: 320
    Identifier:
      name: identifier
      in: path
      required: true
      description: Canonical account or `anyone`.
      schema:
        type: string
        minLength: 1
        maxLength: 320
    JobID:
      name: job
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    UID:
      name: uid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 4294967295
    UIDValidity:
      name: uidvalidity
      in: query
      required: true
      description: UIDVALIDITY the UID belongs to.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 4294967295
    ScriptName:
      name: name
      in: path
      required: true
      description: At most 512 bytes of UTF-8.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag of the version the change is based on.
      schema:
        type: string
        maxLength: 128
  headers:
    ETag:
      description: Version of the resource (use in If-Match).
      schema:
        type: string
  responses:
    Error:
      description: |
        Failure. `code` is stable: `bad_request` (400), `unauthenticated`
        (401), `forbidden` (403), `no_such_user` and `no_such_mailbox`
        (404), `too_large` (413), `rejected` (422, Sieve ereject, or a
        reject that sends no rejection message: no relay, the relay refused
        it, or sieve_reject_mode=protocol), `over_quota` (507), `temporary` (503, try again), `internal` (500),
        `conflict` (409, imported data contradicts the target, or the
        account directory is not ready for a batch),
        `import_locked` (409, another session holds the account),
        `account_purging` (409, the account (or the grantee of an ACL change)
        is being purged; if no purge job runs any more, see
        `shardpostctl account repair`),
        `not_locked` (409, the session does not hold the lock),
        `precondition_failed` (412, If-Match does not match),
        `limit_exceeded` (409, the change would take the account beyond
        one of its configured limits, see `limits` in the configuration),
        `no_such_job` (404, job, plan or learning job), `no_such_message`
        (404), `no_such_script` (404), `no_such_submission` (404).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, unauthenticated, forbidden, no_such_user, no_such_mailbox, no_such_message, no_such_script, too_large, rejected, over_quota, temporary, internal, conflict, import_locked, account_purging, not_locked, precondition_failed, no_such_job, limit_exceeded, no_such_submission]
        message:
          type: string
    SubmissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
        next:
          type: string
          description: Pass as `after` for the next page (listAllSubmissions only); absent at the end.
    Submission:
      type: object
      description: |
        A delayed JMAP submission as the submission queue keeps it. The
        state `failed` and an `unknown` result show in JMAP as
        undoStatus `final`.
      required: [id, account, state, release, due, created, attempts, size, mail_from, rcpt_to]
      properties:
        id:
          type: string
        account:
          type: string
        state:
          type: string
          enum: [pending, sending, final, canceled, failed]
          x-enum-varnames: [SubmissionPending, SubmissionSending, SubmissionFinal, SubmissionCanceled, SubmissionFailed]
        release:
          type: string
          format: date-time
          description: The release time the client asked for (sendAt).
        due:
          type: string
          format: date-time
          description: When a pending submission is tried next (later than `release` after a temporary failure).
        created:
          type: string
          format: date-time
        sending_since:
          type: string
          format: date-time
          description: Start of the current attempt (state `sending`).
        finished:
          type: string
          format: date-time
        attempts:
          type: integer
        size:
          type: integer
          format: int64
        mail_from:
          type: string
        rcpt_to:
          type: array
          items:
            type: string
        unknown:
          type: boolean
          description: The sending was interrupted; the message may or may not have been relayed and is not sent again.
        reason:
          type: string
          description: Why it failed or its result is unknown, or why the last attempt was retried.
        canceled_by:
          type: string
    Version:
      type: object
      required: [version, go_version]
      properties:
        version:
          type: string
        go_version:
          type: string
    DeliveryResult:
      type: object
      required: [account, stored, disposition]
      properties:
        account:
          type: string
          description: Canonical account the recipient resolved to.
        disposition:
          type: string
          enum: [stored, discarded, rejected]
          x-enum-varnames: [DispositionStored, DispositionDiscarded, DispositionRejected]
          description: |
            What became of the message: `stored` (see `stored`),
            `discarded` by Sieve (also a Sieve reject of mail from the null
            sender, which gets no rejection message), or `rejected` by a
            Sieve reject that sent a rejection message to the sender.
        stored:
          type: array
          description: Stored copies; empty when Sieve discarded or rejected the message.
          items:
            $ref: "#/components/schemas/StoredMessage"
    StoredMessage:
      type: object
      required: [mailbox, uid, guid, size]
      properties:
        mailbox:
          type: string
        uid:
          type: integer
          format: int64
        guid:
          type: string
        size:
          type: integer
          format: int64
    ImportSessionRequest:
      type: object
      properties:
        session:
          type: string
          description: Resume this session (it must hold the lock or the lock must be free); omitted, the server chooses one.
          pattern: "^[A-Za-z0-9_-]{16,64}$"
        messages:
          type: integer
          minimum: 0
          description: |
            How many messages the import is going to store (a hint): a
            fresh layout 3 full-text index is sized for them when the first
            batch creates it. Kept by this server for the session.
    ImportSession:
      type: object
      required: [account, session, expires_at]
      properties:
        account:
          type: string
        session:
          type: string
        expires_at:
          type: string
          format: date-time
    ImportMailboxSpec:
      type: object
      required: [name, uidvalidity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        uidvalidity:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
        id:
          type: string
          description: Preferred mailbox id (32 lowercase hex digits, e.g. the Dovecot mailbox GUID).
          maxLength: 64
        special_use:
          type: array
          items:
            type: string
        subscribed:
          type: boolean
        replace:
          type: boolean
          description: |
            Replace an existing mailbox with another UIDVALIDITY even if it
            holds messages (they are removed): the source recreated the
            mailbox and it is imported again.
    ImportMailboxState:
      type: object
      required: [id, name, uidvalidity, uid_next, highest_modseq, subscribed, special_use]
      properties:
        id:
          type: string
        name:
          type: string
        uidvalidity:
          type: integer
          format: int64
        uid_next:
          type: integer
          format: int64
        highest_modseq:
          type: integer
          format: int64
        subscribed:
          type: boolean
        special_use:
          type: array
          items:
            type: string
    ImportMailboxList:
      type: object
      required: [mailboxes]
      properties:
        mailboxes:
          type: array
          items:
            $ref: "#/components/schemas/ImportMailboxState"
    ImportInventoryEntry:
      type: object
      required: [uid, guid, size, modseq, flags]
      properties:
        uid:
          type: integer
          format: int64
        guid:
          type: string
        size:
          type: integer
          format: int64
        modseq:
          type: integer
          format: int64
        flags:
          type: array
          items:
            type: string
    ImportInventory:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ImportInventoryEntry"
        next_after:
          type: integer
          format: int64
    ImportResult:
      type: object
      required: [imported, existing, shared, bytes]
      properties:
        imported:
          type: integer
        existing:
          type: integer
        shared:
          type: integer
        bytes:
          type: integer
          format: int64
    ImportFlagChange:
      type: object
      required: [uid, modseq, flags]
      properties:
        uid:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
        modseq:
          type: integer
          format: int64
          minimum: 0
        flags:
          type: array
          items:
            type: string
    ImportChanges:
      type: object
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/ImportFlagChange"
        expunge:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 4294967295
    ImportFinalize:
      type: object
      required: [uid_next, highest_modseq]
      properties:
        uid_next:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
        highest_modseq:
          type: integer
          format: int64
          minimum: 0
    ImportReader:
      type: object
      required: [uidvalidity, seen]
      properties:
        uidvalidity:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          description: UIDVALIDITY the UIDs belong to; another one is a conflict.
        seen:
          type: array
          description: UIDs the reader has seen; every other message is unseen for the reader.
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 4294967295
        subscribed:
          type: boolean
    ImportReaderResult:
      type: object
      required: [changed]
      properties:
        changed:
          type: integer
          description: Messages whose `\Seen` changed for the reader.
    ImportACL:
      type: object
      required: [entries]
      properties:
        entries:
          type: object
          additionalProperties:
            type: string
    ImportMetadata:
      type: object
      required: [entries]
      properties:
        entries:
          type: object
          additionalProperties:
            type: string
    ImportSieve:
      type: object
      required: [scripts, active]
      properties:
        scripts:
          type: array
          items:
            $ref: "#/components/schemas/ImportSieveScript"
        active:
          type: string
    ImportSieveScript:
      type: object
      required: [name, script]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        script:
          type: string
    TraceRequest:
      type: object
      properties:
        duration_seconds:
          type: integer
          minimum: 1
          description: How long the trace lasts (capped at the configured maximum).
    AuthFlushRequest:
      type: object
      properties:
        account:
          type: string
          description: |
            The account, login name or address whose entries are dropped;
            empty or `*` drops every entry.
    AuthFlush:
      type: object
      required: [account, cached]
      properties:
        account:
          type: string
          description: The name that was flushed, in lower case; `*` for every entry.
        cached:
          type: boolean
          description: |
            Whether this server has an auth cache (false with the static
            backend or `auth.cache.ttl` 0; nothing was flushed then).
    BatchPlanRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          pattern: "^(index_check|scrub|fts_rebuild|attachment_backfill|fts_layout)$"
          description: The kind to run on every account.
        params:
          type: object
          additionalProperties: true
          description: |
            Parameters of the kind for every account; scrub: `classes`
            (empty = all); fts_layout: `layout`, `shards` or `shape`,
            `dict_filter`, `due_only`, `online` (see `FTSLayoutParams`);
            fts_rebuild: `online`, `skip_unreadable`, `drop_orphan_ids`
            (see `FTSRebuildParams`). The other kinds take none. An
            omitted `online` is decided by the plan for the whole batch
            (accounts without a layout 3 index then count as
            `unsupported`).
        skip_idle:
          type: boolean
          description: |
            scrub only: skip the accounts whose last batch scrub was
            complete, found nothing and is younger than
            `scrub.interval_days`, and which did not change since.
        anytime:
          type: boolean
          description: |
            fts_layout and fts_rebuild only (since 0.51.0): ignore the
            reshard window. Without it a batch starts an account only
            inside `fts.reshard_window` and, for an online run, only when
            its estimate fits into what is left of the window; outside it
            gives the job back until the next window starts (it shows
            `waiting for the reshard window`) and goes on from its
            checkpoint. An account whose estimate is longer than the
            whole window fails with `window_too_small`.
    AccountPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountListEntry"
        next:
          type: string
          description: Cursor of the next page; absent on the last.
    AccountListEntry:
      type: object
      required: [account, entry]
      properties:
        account:
          type: string
        entry:
          $ref: "#/components/schemas/DirectoryEntry"
    AccountScrub:
      type: object
      description: The last batch scrub of the account.
      required: [at, complete, findings, account_seq, registry_version]
      properties:
        at:
          type: string
          format: date-time
          description: When it ended.
        complete:
          type: boolean
          description: Whether it looked at everything (no import, no error, no change during the run).
        findings:
          type: integer
          description: Number of findings (repaired or reported).
        account_seq:
          type: integer
          format: int64
          description: Account change counter it left the account at.
        registry_version:
          type: integer
          format: int64
          description: Object version of the registry it left the account at.
    DirectoryEntry:
      type: object
      description: The account's entry in the account directory.
      required: [created, state]
      properties:
        created:
          type: string
          format: date-time
          description: When the account's registry was last created (for accounts a backfill entered, the registry's last change).
        state:
          type: string
          enum: [active, purging]
        session:
          type: string
          description: Lock session of the purge job (only while purging).
        cluster:
          type: string
          description: Ceph cluster (fsid) that holds the account.
        scrub:
          $ref: "#/components/schemas/AccountScrub"
    DirectoryStatus:
      type: object
      required: [account, found, registry, shards, phase]
      properties:
        account:
          type: string
        found:
          type: boolean
          description: Whether the account has an entry.
        entry:
          $ref: "#/components/schemas/DirectoryEntry"
        registry:
          type: boolean
          description: Whether the account's registry object exists.
        shards:
          type: integer
          description: Shard count of the directory.
        phase:
          type: string
          description: Phase of the directory (`stable` or `copying:<n>`).
        backfill:
          type: string
          description: Completion marker of the last backfill (JSON with start, end and counts); absent before the first.
    DirectoryRepair:
      type: object
      required: [account, action, found]
      properties:
        account:
          type: string
        action:
          type: string
          enum: [none, purge_running, removed, activated, stale_removed]
          description: |
            `none`: nothing to repair (or the account has no entry);
            `purge_running`: a purge job still works on the account;
            `removed`: purging without registry, the entry was removed;
            `activated`: purging with registry, the entry is active again;
            `stale_removed`: active, older than the grace and without
            registry, the entry was removed.
        found:
          type: boolean
          description: Whether the account had an entry.
        before:
          $ref: "#/components/schemas/DirectoryEntry"
        after:
          $ref: "#/components/schemas/DirectoryEntry"
    FTSLayoutShape:
      type: object
      required: [layout]
      properties:
        layout:
          type: integer
          description: 2 (fixed shards) or 3 (an index generation).
        gen:
          type: string
          description: The generation (layout 3).
        s:
          type: integer
          description: Posting objects.
        d:
          type: integer
          description: Dictionary objects.
        h:
          type: integer
          description: Header text objects.
        dict_id_min_runes:
          type: integer
          description: |
            The identifier filter of the generation's dictionary (since
            0.50.0): a body term with letters and digits of at least
            this many runes has one start entry instead of its trigram
            keys. Missing: no filter.
        attached_headers:
          type: string
          description: |
            The text preparation of the generation (since 0.50.0):
            `nosig` without the signature and trace fields of attached
            headers. Missing: every field.
    FTSStats:
      type: object
      required: [shape, docs, exact, terms, dict_keys, header_keys, objects]
      properties:
        shape:
          $ref: "#/components/schemas/FTSLayoutShape"
        docs:
          type: integer
          format: int64
          description: |
            Documents of the index: the counter `c` of layout 3; for
            layout 2 only with `exact` (the id map), else 0.
        exact:
          type: boolean
          description: The keys were counted, not the counters read.
        terms:
          type: integer
          format: int64
          description: Posting keys (terms), the sum of `!n` or counted.
        dict_keys:
          type: integer
          format: int64
          description: Dictionary keys, the sum of `!dn` or counted.
        header_keys:
          type: integer
          format: int64
          description: Header texts (counted with `exact` only).
        objects:
          type: array
          items:
            $ref: "#/components/schemas/FTSObjectStats"
        classes:
          $ref: "#/components/schemas/FTSTermClasses"
    FTSObjectStats:
      type: object
      required: [object, kind, keys]
      properties:
        object:
          type: string
        kind:
          type: string
          enum: [postings, dictionary, headers, legacy]
        keys:
          type: integer
          format: int64
          description: Keys without the markers; for a posting object without `exact` its counter `!n`.
        dict_keys:
          type: integer
          format: int64
          description: The counter `!dn` of a posting object (without `exact`).
    FTSTermClasses:
      type: object
      required: [terms, dict_keys, rows, by_ident_min_runes]
      properties:
        terms:
          type: integer
          format: int64
        dict_keys:
          type: integer
          format: int64
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FTSTermClass"
        by_ident_min_runes:
          type: array
          description: |
            For every bound n from 13 to 40: the dictionary keys if body
            terms with letters and digits of at least n runes had one key
            each, and how many terms that are.
          items:
            $ref: "#/components/schemas/FTSIdentBound"
    FTSTermClass:
      type: object
      required: [field, class, length, terms, dict_keys]
      properties:
        field:
          type: string
          description: s, f, t, h or b.
        class:
          type: string
          enum: [letters, digits, mixed, other]
        length:
          type: string
          description: Length range in runes (2-3, 4-8, 9-12, 13-16, 17-24, 25-32, 33-39, 40).
        terms:
          type: integer
          format: int64
        dict_keys:
          type: integer
          format: int64
    FTSIdentBound:
      type: object
      required: [min_runes, dict_keys, identifiers]
      properties:
        min_runes:
          type: integer
        dict_keys:
          type: integer
          format: int64
        identifiers:
          type: integer
          format: int64
    FTSLayoutState:
      type: object
      required: [current]
      properties:
        current:
          $ref: "#/components/schemas/FTSLayoutShape"
        next:
          $ref: "#/components/schemas/FTSLayoutShape"
        next_tok:
          type: string
          description: The run of the conversion in progress (`job-<id>/<lease generation>` or `<session>/<nonce>`).
        next_at:
          type: string
          format: date-time
          description: Last heartbeat of an import reshard run.
        next_online:
          type: boolean
          description: |
            The conversion in progress runs online, without the account's
            lock (since 0.51.0): writers record what they index for it.
        next_mode:
          type: string
          enum: [copy, reindex]
          description: |
            The mode of an online run: `copy` from the postings (a
            reshard, a change of the identifier filter), `reindex` from
            the messages (a rebuild).
        old:
          type: array
          description: Source generations a conversion switched away from and has not removed yet.
          items:
            $ref: "#/components/schemas/FTSLayoutShape"
        old_toks:
          type: array
          description: The runs that left the `old` generations, in the same order.
          items:
            type: string
        old_at:
          type: array
          description: |
            The last heartbeat of each run of `old_toks` (RFC 3339), in the
            same order; empty for a job, whose job state tells whether it
            still runs. An import reshard renews it until it removed its
            sources.
          items:
            type: string
    FTSLayoutClear:
      type: object
      required: [cleared, state]
      properties:
        cleared:
          type: string
          description: The tokens of the runs whose conversion or left-behind sources were removed, comma-separated; empty for none.
        state:
          $ref: "#/components/schemas/FTSLayoutState"
    FTSLayout3Mark:
      type: object
      required: [enabled_at, pods]
      properties:
        enabled_at:
          type: string
          format: date-time
        principal:
          type: string
        pods:
          type: integer
        forced:
          type: boolean
    ServerRegistration:
      type: object
      required: [instance, version, caps, seen, fresh]
      properties:
        instance:
          type: string
        version:
          type: string
        caps:
          type: array
          items:
            type: string
        seen:
          type: string
          format: date-time
        fresh:
          type: boolean
          description: Seen within the last three minutes and not stopped.
        role:
          type: string
          description: |
            What the process is: `serve`, `push`, `scrub`, `backfill` or
            `sweep`; missing in registrations before 0.47.0, which are
            servers.
        system_pool:
          $ref: "#/components/schemas/PoolRef"
        started_at:
          type: string
          format: date-time
          description: When the process started (since 0.47.0).
        stopped_at:
          type: string
          format: date-time
          description: When the process ended in order; missing while it runs or after a crash.
        partitions:
          type: integer
          description: |
            The push partitions a push worker holds (role `push`, since
            0.52.0); missing for the other roles.
        watched:
          type: integer
          description: |
            The accounts with push subscriptions a push worker watches
            (role `push`, since 0.52.0); missing for the other roles.
    ServerRegistrationList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/ServerRegistration"
    PoolRef:
      type: object
      required: [id, name]
      description: A pool by its id (what placement checks compare) and its name.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Placement:
      type: object
      required: [state]
      description: Where the store's own namespaces live, as the last placement check of this server found it.
      properties:
        state:
          type: string
          description: |
            `none`: in the index pool; `native`: in the system pool,
            initialized there; `migrated`: in the system pool, migrated
            there; `unknown`: the last check could not read the fence or
            the mark.
        system_pool:
          $ref: "#/components/schemas/PoolRef"
    FTSLayout3Status:
      type: object
      required: [enabled, servers]
      properties:
        enabled:
          type: boolean
        mark:
          $ref: "#/components/schemas/FTSLayout3Mark"
        servers:
          type: array
          items:
            $ref: "#/components/schemas/ServerRegistration"
    FTSLayout3Enable:
      type: object
      required: [pods]
      properties:
        pods:
          type: integer
          minimum: 1
          maximum: 100000
          description: The number of servers running now; exactly as many fresh registrations must report the capability of the mark.
        force:
          type: boolean
          description: Set the mark without the check.
    FTSLayout3Disable:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            type: string
          description: |
            Accounts that still need the mark's version: for layout 3 a
            layout 3 index, for the dictionary filter a generation with
            the filter or the text preparation `nosig` (at most 1000).
        more:
          type: boolean
          description: There are more than listed.
    FTSLayoutAccount:
      type: object
      required: [account]
      properties:
        account:
          type: string
        since:
          type: string
          format: date-time
        layout:
          $ref: "#/components/schemas/FTSLayoutState"
        mismatch:
          type: boolean
          description: With verify, the account has no layout 3 index (or no conversion to it).
        error:
          type: string
    FTSLayoutAccountPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FTSLayoutAccount"
        next:
          type: string
          description: Pass as `after` for the next page; absent at the end.
    ImportReshard:
      type: object
      required: [state, g]
      properties:
        state:
          type: string
          pattern: "^(idle|running|done|failed)$"
          description: |
            `idle` (nothing to do or nothing runs), `running`, `done` (the
            reshard finished; this server's runs only), `failed` (with
            `error`).
        g:
          type: string
          description: The current index generation (empty in layout 2).
        error:
          type: string
    TraceStatus:
      type: object
      required: [account, active]
      properties:
        account:
          type: string
        active:
          type: boolean
        until:
          type: string
          format: date-time
          description: End of the trace (only while active).
        set_by:
          type: string
          description: Admin principal that switched it on.
        set_at:
          type: string
          format: date-time
    ServerStatus:
      type: object
      required: [version, go_version, instance, started_at, config_fingerprint, store]
      properties:
        version:
          type: string
        go_version:
          type: string
        instance:
          type: string
          description: Host name of the answering server (pod).
        started_at:
          type: string
          format: date-time
        config_fingerprint:
          type: string
          description: SHA-256 over the effective configuration without secret values.
        store:
          $ref: "#/components/schemas/StoreStatus"
        placement:
          $ref: "#/components/schemas/Placement"
    StoreStatus:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
    AccountStatus:
      type: object
      required: [account, lookup, store_exists, mailboxes, quota, import_locked, trace_active]
      properties:
        account:
          type: string
        lookup:
          type: string
          enum: [canonical, alias, unknown, unavailable, public]
          description: |
            Outcome of the Nauthilus lookup of `account`; `public` is the
            public namespace, which has no user database entry.
        canonical_account:
          type: string
        store_exists:
          type: boolean
          description: Whether the store namespace of `account` has mailboxes.
        mailboxes:
          type: integer
        quota:
          $ref: "#/components/schemas/QuotaStatus"
        import_locked:
          type: boolean
        trace_active:
          type: boolean
        trace_until:
          type: string
          format: date-time
    MailboxSummary:
      type: object
      required: [id, name, uidvalidity, uid_next, highest_modseq, shard_size, subscribed, special_use, acl_entries]
      properties:
        id:
          type: string
        name:
          type: string
        uidvalidity:
          type: integer
          format: int64
        uid_next:
          type: integer
          format: int64
        highest_modseq:
          type: integer
          format: int64
        shard_size:
          type: integer
          format: int64
        subscribed:
          type: boolean
        special_use:
          type: array
          items:
            type: string
        acl_entries:
          type: integer
    MailboxPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MailboxSummary"
        next:
          type: string
          description: Pass as `after` for the next page; absent on the last page.
    MailboxDetail:
      type: object
      required: [mailbox, messages, unseen, deleted, size_bytes, shards, log_start, recent_from, keywords]
      properties:
        mailbox:
          $ref: "#/components/schemas/MailboxSummary"
        messages:
          type: integer
          format: int64
        unseen:
          type: integer
          format: int64
        deleted:
          type: integer
          format: int64
        size_bytes:
          type: integer
          format: int64
        shards:
          type: integer
          format: int64
          description: Index shards covering UIDs below uid_next.
        log_start:
          type: integer
          format: int64
          description: Oldest modseq the change log covers (QRESYNC horizon).
        recent_from:
          type: integer
          format: int64
        keywords:
          type: array
          items:
            type: string
    ACLEntry:
      type: object
      required: [identifier, rights]
      properties:
        identifier:
          type: string
        rights:
          type: string
    MailboxACL:
      type: object
      required: [owner, mailbox, generation, entries]
      properties:
        owner:
          type: string
        mailbox:
          type: string
        generation:
          type: integer
          format: int64
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ACLEntry"
    ACLExplanation:
      type: object
      required: [owner, mailbox, principal, lookup, rights, is_owner, own_entry, anyone_entry, visible, pointer, findings]
      properties:
        owner:
          type: string
        mailbox:
          type: string
        principal:
          type: string
        lookup:
          type: string
          enum: [canonical, alias, unknown, unavailable]
        canonical_principal:
          type: string
        rights:
          type: string
          description: Effective rights of the canonical principal.
        is_owner:
          type: boolean
        own_entry:
          type: string
          description: Rights of the principal's own ACL entry ("" if none).
        anyone_entry:
          type: string
        visible:
          type: boolean
          description: The principal can see the mailbox (right l or owner).
        pointer:
          $ref: "#/components/schemas/SharedPointer"
        findings:
          type: array
          items:
            type: string
    SharedPointer:
      type: object
      required: [present]
      properties:
        present:
          type: boolean
        subscribed:
          type: boolean
        generation:
          type: integer
          format: int64
          description: |
            ACL generation of the last pointer write for this principal
            (informational; SETACLs for other identifiers raise the
            mailbox's generation without touching this pointer).
    SharedRef:
      type: object
      required: [owner, mailbox, subscribed, generation]
      properties:
        owner:
          type: string
        mailbox:
          type: string
        subscribed:
          type: boolean
        generation:
          type: integer
          format: int64
    SharedList:
      type: object
      required: [account, items]
      properties:
        account:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/SharedRef"
    QuotaStatus:
      type: object
      required: [usage_bytes, usage_messages, limit_bytes, limit_messages]
      properties:
        usage_bytes:
          type: integer
          format: int64
        usage_messages:
          type: integer
          format: int64
        limit_bytes:
          type: integer
          format: int64
          description: 0 is unlimited.
        limit_messages:
          type: integer
          format: int64
          description: 0 is unlimited.
    MailboxCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        special_use:
          type: array
          items:
            type: string
    MailboxUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        subscribed:
          type: boolean
    ACLChange:
      type: object
      required: [rights]
      properties:
        rights:
          type: string
          maxLength: 32
          description: RFC 4314 rights (c and d expand as usual).
        mode:
          type: string
          enum: [replace, add, remove]
          default: replace
    JobState:
      type: string
      enum: [queued, running, succeeded, partially_failed, failed, cancel_requested, cancelled]
    FTSLayoutParams:
      type: object
      description: |
        The parameters of the kind `fts_layout` in `params` of a plan or a
        batch plan. `shards` and `shape` exclude each other (both: 400);
        forced counts ignore `fts.shards_max` and `fts.dict_shards_max`.
        Without either the counts follow the key counts: posting and
        header objects from `fts.shard_target_keys` up to
        `fts.shards_max`, dictionary objects from `fts.dict_target_keys`
        up to `fts.dict_shards_max`.
      properties:
        layout:
          type: integer
          enum: [2, 3]
          description: The target layout; omitted, the account's.
        shards:
          type: integer
          minimum: 1
          maximum: 4096
          description: |
            Forced object counts of a layout 3 target, the same for the
            posting, dictionary and header objects.
        shape:
          type: string
          pattern: "^[0-9]+/[0-9]+/[0-9]+$"
          description: |
            Forced object counts of a layout 3 target, each its own:
            posting/dictionary/header objects, 1 to 4096 each (since
            0.49.0).
        dict_filter:
          type: string
          enum: [none, ids]
          description: |
            The identifier filter of a layout 3 target (since 0.50.0):
            `ids` with `fts.dict_id_min_runes` (needs the cluster mark
            of the filter, else 409), `none` without; omitted, as
            `fts.dict_filter` and the mark say. The postings are copied
            either way and the dictionary derived from them anew, so
            both directions are exact. Not with `layout: 2`.
        due_only:
          type: boolean
          description: |
            End without a change while the key counts ask for the shape
            the index has and its identifier filter is the one asked for
            (how the `fts_due` worker plans the job).
        online:
          type: boolean
          description: |
            Run without the account's maintenance lock (since 0.51.0):
            deliveries, logins and sessions go on, the target is built
            beside the current generation and one compare-and-swap
            switches to it. `true` needs the cluster mark of online runs
            (`POST /admin/v1/fts/online/enable`, else 409) and a layout
            3 index (else 400; a batch counts such accounts as
            unsupported); omitted, the plan decides: online with the
            mark and `fts.online_build: auto`, else offline. The plan
            records the decision. Not with `layout: 2`.
    FTSRebuildParams:
      type: object
      description: |
        The parameters of the kind `fts_rebuild` in `params` of a plan or
        a batch plan (since 0.51.0).
      properties:
        online:
          type: boolean
          description: |
            Rebuild without the account's maintenance lock: the target
            generation is indexed from the messages beside the current
            one (with the identifier filter and the text preparation the
            configuration and the cluster mark of the filter ask for),
            the id map stays, and one compare-and-swap switches. It sets
            the version marker of the target and removes the rebuild key
            of an offline rebuild that stopped midway. Decided as
            `online` of `fts_layout`.
        skip_unreadable:
          type: boolean
          description: |
            Online only: skip a live message whose blob cannot be read
            (counted as `unreadable`) instead of failing the run.
        drop_orphan_ids:
          type: boolean
          description: |
            Online only (default true): drop the ids that have neither a
            blob nor a mailbox entry (counted as `orphan_ids`); false
            only counts them.
    PlanRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [scrub, quota_recalc, acl_reconcile, fts_rebuild, fts_dict_convert, fts_layout, mailbox_name_convert, attachment_backfill, mailbox_delete, expunge, purge]
        params:
          type: object
          additionalProperties: true
          description: |
            scrub: `classes` (deliveries, moves, retired, uncovered, entries,
            refs, orphans, unknown, quota; empty = all); fts_layout:
            `layout`, `shards` or `shape`, `dict_filter`, `due_only`,
            `online` (see `FTSLayoutParams`); fts_rebuild: `online`,
            `skip_unreadable`, `drop_orphan_ids` (see
            `FTSRebuildParams`); mailbox_delete:
            `mailbox_id`; expunge: `mailbox_id` and `uids` (list) or
            `deleted: true` (every message flagged \Deleted when planned).
    Plan:
      type: object
      required: [id, kind, account, summary, principal, created, expires]
      properties:
        id:
          type: string
        kind:
          type: string
          description: The kind; `batch` for a plan over all accounts.
        account:
          type: string
          description: The account; empty for a batch.
        params:
          type: object
          additionalProperties: true
        summary:
          type: object
          additionalProperties: true
          description: What the job would do (kind-specific).
        principal:
          type: string
        created:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
        applied_job:
          type: string
    JobRequest:
      type: object
      properties:
        plan_id:
          type: string
          maxLength: 64
        kind:
          type: string
          enum: [index_check]
        account:
          type: string
          maxLength: 320
    JobProgress:
      type: object
