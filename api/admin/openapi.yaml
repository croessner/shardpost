openapi: 3.0.3
info:
  title: ShardPost Admin API
  version: 1.0.0
  description: |
    Internal administration interface of ShardPost (roadmap stage 8).
    Reachable only on the configured admin listeners: a Unix socket inside
    the pod (the peer's UID is the identity) and optionally TCP with mutual
    TLS (the client certificate is the identity). Every operation requires
    a role; roles are assigned to identities in the server configuration.
servers:
  - url: /
security: []
paths:
  /admin/v1/version:
    get:
      operationId: getVersion
      summary: Server version
      description: Requires the role `diagnose`.
      responses:
        "200":
          description: Version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/server:
    get:
      operationId: getServerStatus
      summary: Server status
      description: |
        Version, instance, start time, a fingerprint of the effective
        configuration (secrets excluded) and whether the store answers.
        Requires the role `diagnose`.
      responses:
        "200":
          description: Status of this server instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: getAccount
      summary: Account overview
      description: |
        Resolves the account through Nauthilus (canonical account) and
        shows its store state: whether mailboxes exist, quota usage and
        limit, import lock and protocol trace. Aliases are accepted here and
        report their canonical account; the store fields then describe
        the namespace under the given name. Reads only. Requires the role
        `diagnose`.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: listMailboxes
      summary: Mailboxes of an account, page by page
      description: |
        Mailboxes in name order with registry data and index header (one
        read per mailbox; message counts only in getMailbox). `after`
        continues after the `next` value of the previous page; `name`
        returns only the mailbox with that exact name. The account must be
        canonical. Requires the role `diagnose`.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: name
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMailbox
      summary: Create a mailbox
      description: |
        Creates the mailbox (parents are implicit). Repeating the request
        for an existing mailbox with the same special-use answers 200 with
        it (idempotent); a different special-use is a conflict (409). The
        account must be canonical. Requires the role `provision`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxCreate"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxSummary"
        "200":
          description: Existed already as requested.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxSummary"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    get:
      operationId: getMailbox
      summary: One mailbox in detail
      description: |
        Registry data, index header and counts over all messages (reads
        every index shard of the mailbox). Requires the role `diagnose`.
      responses:
        "200":
          description: The mailbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxDetail"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMailbox
      summary: Rename a mailbox or change its subscription
      description: |
        `name` renames the mailbox together with its children (INBOX
        cannot be renamed; an existing target is a conflict), `subscribed`
        sets the subscription. Renaming to the current name is a no-op.
        `If-Match` (the mailbox's ETag) makes the change conditional (412
        on mismatch). Requires the role `provision`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxUpdate"
      responses:
        "200":
          description: The mailbox after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxSummary"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/acl:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    get:
      operationId: getMailboxACL
      summary: ACL of a mailbox
      description: |
        The explicit entries (the owner has all rights implicitly and is not
        listed) and the ACL generation. Requires the role `diagnose`.
      responses:
        "200":
          description: The ACL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxACL"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/acl/{identifier}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/Identifier"
      - $ref: "#/components/parameters/IfMatch"
    put:
      operationId: setACLEntry
      summary: Change the rights of one identifier
      description: |
        `mode` replace sets the rights, add and remove change them
        relative to the current entry; the change is computed and stored
        in one versioned step on the server, so concurrent changes do not
        lose each other. `If-Match` is the ACL ETag (412 on mismatch).
        The identifier must be a canonical account or `anyone`, not the
        owner. The grantee's shared pointer follows. Requires the role
        `provision`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ACLChange"
      responses:
        "200":
          description: The ACL after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxACL"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteACLEntry
      summary: Remove the entry of one identifier
      description: Like setACLEntry with empty rights. Requires the role `provision`.
      responses:
        "200":
          description: The ACL after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxACL"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/acl/explain:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    get:
      operationId: explainMailboxACL
      summary: Why a principal can (not) use a mailbox
      description: |
        Resolves the principal to its canonical account, computes its
        effective rights with the same function IMAP uses (own entry plus
        "anyone") and checks the pointer in the principal's registry that
        makes the mailbox appear in the shared namespace. `findings` names
        every reason in plain text. Requires the role `diagnose`.
      parameters:
        - name: principal
          in: query
          required: true
          description: Account (or alias) whose access is explained.
          schema:
            type: string
            minLength: 1
            maxLength: 320
      responses:
        "200":
          description: The explanation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACLExplanation"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/quota:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: getQuota
      summary: Quota usage and limit
      description: |
        Stored usage counters and the effective limit (0 = unlimited).
        Requires the role `diagnose`.
      responses:
        "200":
          description: The quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/shared:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: listSharedMailboxes
      summary: Mailboxes of other accounts shared with this account
      description: |
        The pointers in the account's registry (the mailboxes of other
        accounts it sees, as "<owner>/<mailbox>").
        Requires the role `diagnose`.
      responses:
        "200":
          description: The pointers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedList"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/plans:
    parameters:
      - $ref: "#/components/parameters/Account"
    post:
      operationId: createPlan
      summary: Plan a maintenance job (dry run)
      description: |
        Computes what the job would do (target set, effects) and stores the
        plan; apply it with `POST /admin/v1/jobs` before it expires. Kinds
        and roles: `scrub`, `quota_recalc`, `acl_reconcile`, `fts_rebuild`
        (role `repair`), `mailbox_delete`, `expunge`, `purge` (role
        `delete`). A plan
        that changes other accounts (ACL repairs, purge) needs them in the
        client scope. The account must be canonical.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/plans/{plan}:
    parameters:
      - name: plan
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    get:
      operationId: getPlan
      summary: A plan
      description: Requires the role `diagnose`.
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/jobs:
    get:
      operationId: listJobs
      summary: Jobs, oldest first
      description: |
        Requires the role `diagnose`; a client with an account scope must
        name an account.
      parameters:
        - name: account
          in: query
          required: false
          schema:
            type: string
            maxLength: 320
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: submitJob
      summary: Apply a plan or start a check
      description: |
        With `plan_id` the plan is applied (once, before it expires; the
        apply refuses when the account drifted from the plan). Without
        it, `kind` `index_check` (role `diagnose`) checks the `account`
        read-only. The job runs on any server and survives restarts.
        `Idempotency-Key` returns the same job for a repeated request
        (200) and refuses the key for another request (409).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "200":
          description: The job of an earlier request with the same key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/jobs/{job}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getJob
      summary: A job with progress and result
      description: Requires the role `diagnose`.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/jobs/{job}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: cancelJob
      summary: Ask a job to stop
      description: |
        A queued job is cancelled at once, a running one at its next safe
        point (no rollback of what it did). Requires the role of the kind.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    get:
      operationId: listMessages
      summary: Messages of a mailbox (metadata only), by UID
      description: |
        UID, GUID, size, flags, dates and MODSEQ, without headers or
        content. Page with `after_uid`. Requires the role `diagnose`.
      parameters:
        - name: after_uid
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/messages/{uid}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/UID"
      - $ref: "#/components/parameters/UIDValidity"
    get:
      operationId: getMessage
      summary: One message with envelope and header section
      description: |
        The message is named by mailbox id, UIDVALIDITY and UID, so a
        recreated mailbox cannot answer with another message (412).
        Requires the role `content`; the audit log records the
        identity, not the content.
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetail"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/messages/{uid}/raw:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/UID"
      - $ref: "#/components/parameters/UIDValidity"
    get:
      operationId: exportMessage
      summary: Export one message (RFC 5322)
      description: Requires the role `content`.
      responses:
        "200":
          description: The message as stored.
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/messages/flags:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    post:
      operationId: setMessageFlags
      summary: Add or remove flags
      description: |
        Changes the flags of the given UIDs like IMAP STORE (`\Recent`
        cannot be set). `uidvalidity` must match (412), UIDs that no
        longer exist are reported as missing, `unchanged_since`
        (CONDSTORE) skips messages changed since that MODSEQ. Requires the
        role `support`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagRequest"
      responses:
        "200":
          description: What changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/mailboxes/{id}/messages/copy:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
    post:
      operationId: copyMessages
      summary: Copy or move messages to another mailbox of the account
      description: |
        Like IMAP COPY/MOVE with UIDPLUS: the result maps each source UID
        to its UID in the destination. `uidvalidity` must match (412).
        Requires the role `support`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyRequest"
      responses:
        "200":
          description: The copies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/search:
    parameters:
      - $ref: "#/components/parameters/Account"
    post:
      operationId: searchMessages
      summary: Bounded message search
      description: |
        Searches one mailbox or all mailboxes of the account. Criteria are
        ANDed; `from`, `to`, `subject` match case-insensitively as
        substrings of the envelope, `text` uses the full-text index
        (headers and body). At most `search.scan_limit` messages are
        examined per request; `next` continues a truncated search.
        Requires the role `content`; criteria values are not logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageSearch"
      responses:
        "200":
          description: The hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/export:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: exportAccount
      summary: Export the account as an archive
      description: |
        Streams the account as a versioned tar archive (format
        `shardpost-account-export` 1): per mailbox its identity, state,
        ACL, subscription, special-use and annotations, per message the
        message with UID, GUID, flags, MODSEQ, dates, POP3 UIDL and
        SHA-256, the Sieve scripts, and last a manifest with every entry's
        checksum. The export does not lock the account; messages that
        vanish meanwhile are listed as skipped. An export that fails midway
        ends with an incomplete manifest. Restore with `shardpostctl
        restore` (import API). Requires the role `export`.
      responses:
        "200":
          description: The archive.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/sieve:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: listSieveScripts
      summary: Sieve scripts of the account
      description: Names, sizes, versions and the active script. Requires the role `diagnose`.
      responses:
        "200":
          description: The scripts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveList"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/sieve/{name}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/ScriptName"
    get:
      operationId: getSieveScript
      summary: One Sieve script
      description: Requires the role `content`.
      responses:
        "200":
          description: The script.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveScript"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putSieveScript
      summary: Store (and optionally activate) a Sieve script
      description: |
        The script is compiled first; a script that does not compile is
        refused (400) and nothing is stored. `If-Match` is the script's
        ETag (`*`: must exist), `If-None-Match: *` creates only. Requires
        the role `support`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            enum: ["*"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SievePut"
      responses:
        "200":
          description: The stored script.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveScript"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSieveScript
      summary: Delete an inactive Sieve script
      description: The active script cannot be deleted (409). Requires the role `support`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/sieve-active:
    parameters:
      - $ref: "#/components/parameters/Account"
    put:
      operationId: setActiveSieveScript
      summary: Activate a script or deactivate filtering
      description: An empty name deactivates. Requires the role `support`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SieveActivate"
      responses:
        "200":
          description: The scripts after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveList"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/sieve-check:
    parameters:
      - $ref: "#/components/parameters/Account"
    post:
      operationId: checkSieve
      summary: Compile a script and run it without side effects
      description: |
        Compiles `script` (or the stored script `name`, or the active
        one) with the account's includes and, when a message is given,
        runs it and reports the actions it would take. Nothing is
        executed: no redirect, vacation or notification is sent, no
        external program runs, no duplicate or vacation record is
        written, nothing is filed. A message from the store (`message`)
        requires the role `content`, otherwise `diagnose`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SieveCheck"
      responses:
        "200":
          description: The result (also for a script that does not compile).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveCheckResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/learning:
    get:
      operationId: listLearningJobs
      summary: Learning queue (IMAPSieve learning programs)
      description: |
        Requires the role `diagnose`; a client with an account scope must
        name an account.
      parameters:
        - name: account
          in: query
          required: false
          schema:
            type: string
            maxLength: 320
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LearningState"
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: One page, by job id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPage"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/learning/{job}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getLearningJob
      summary: One learning job
      description: Requires the role `diagnose`.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningJob"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/learning/{job}/retry:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: retryLearningJob
      summary: Retry a dead learning job
      description: |
        Only dead jobs are retried. Learning programs are not idempotent
        (a message learned twice counts twice): a job that was already
        attempted needs `confirm_repeat`. A job whose message was never
        committed (no receipt) cannot be retried. Requires the role
        `repair`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningRetry"
      responses:
        "200":
          description: The job, due now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningJob"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/deliveries:
    post:
      operationId: deliver
      summary: Local delivery (LDA)
      description: |
        Delivers one message to one recipient like a local delivery agent:
        the recipient is resolved like an LMTP recipient, the user's Sieve
        script runs (unless disabled or a mailbox is given) and the message
        is stored all or nothing. Redirect, vacation and notify behave as
        for LMTP. Requires the role `deliver`; `enforce_quota=false` also
        requires `deliver:noenforce` (the usage is still counted).
      parameters:
        - name: recipient
          in: query
          required: true
          description: Envelope recipient (address or account).
          schema:
            type: string
            minLength: 1
            maxLength: 320
        - name: from
          in: query
          required: false
          description: Envelope sender; empty is the null sender.
          schema:
            type: string
            maxLength: 320
        - name: mailbox
          in: query
          required: false
          description: Store directly into this existing mailbox; Sieve does not run.
          schema:
            type: string
            maxLength: 1024
        - name: sieve
          in: query
          required: false
          description: Run the user's Sieve script.
          schema:
            type: boolean
            default: true
        - name: enforce_quota
          in: query
          required: false
          description: Refuse the message when it does not fit the quota.
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Delivered (or discarded by Sieve).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import:
    parameters:
      - $ref: "#/components/parameters/Account"
    post:
      operationId: openImport
      summary: Open or renew an import session
      description: |
        Takes the account's import lock for the session (or renews it).
        While the lock is held, IMAP, POP3, ManageSieve, LMTP and local
        delivery refuse the account temporarily. The account must be the
        canonical account the recipient lookup resolves it to. The lock
        expires after the configured TTL unless renewed; every import
        call renews it. Requires the role `import`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSessionRequest"
      responses:
        "200":
          description: The session holds the lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSession"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: closeImport
      summary: Release the import lock
      parameters:
        - $ref: "#/components/parameters/ImportSessionHeader"
      responses:
        "204":
          description: Released (or not held by this session).
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/ImportSessionHeader"
    get:
      operationId: listImportMailboxes
      summary: Mailboxes of the account with their identity state
      responses:
        "200":
          description: All mailboxes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMailboxList"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putImportMailbox
      summary: Create or adopt a mailbox with the source identity
      description: |
        Creates the mailbox with the source UIDVALIDITY (and the source
        mailbox id if it is 32 hex digits and unused), or adopts an
        existing one with the same UIDVALIDITY. An existing mailbox with
        the source id under another name is renamed. An existing empty
        mailbox with another UIDVALIDITY is replaced; a non-empty one is
        a conflict unless `replace` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportMailboxSpec"
      responses:
        "200":
          description: The mailbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMailboxState"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    delete:
      operationId: deleteImportMailbox
      summary: Delete a mailbox that no longer exists in the source
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    get:
      operationId: listImportMessages
      summary: Inventory of a mailbox (UID order, paged)
      parameters:
        - name: after
          in: query
          required: false
          description: Only UIDs above this one.
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 4294967295
        - name: limit
          in: query
          required: false
          description: Page size (bounded by the server).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: One page; `next_after` is set when more may follow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportInventory"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: importMessages
      summary: Store messages at their source UIDs
      description: |
        The body is `multipart/mixed`; every part is `message/rfc822` and
        carries its identity as JSON in the part header `X-Import-Meta`
        (uid, modseq, flags, internal_date, save_date, guid, pop3_uidl).
        UIDs must be ascending. A UID that already holds a message of the
        same size is skipped (resuming a run); one with a different
        message is a conflict. Quota usage is counted, not enforced.
      requestBody:
        required: true
        content:
          multipart/mixed:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/changes:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    post:
      operationId: importChanges
      summary: Apply source flag changes and expunges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportChanges"
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMailboxState"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/finalize:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    post:
      operationId: finalizeImportMailbox
      summary: Set UIDNEXT and HIGHESTMODSEQ to the source values
      description: |
        UIDNEXT and HIGHESTMODSEQ become at least the source values; the
        change log starts after HIGHESTMODSEQ, so clients resuming from a
        source state get complete answers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFinalize"
      responses:
        "200":
          description: The resulting state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMailboxState"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/acl:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    put:
      operationId: putImportACL
      summary: Replace the explicit ACL entries of a mailbox
      description: Identifiers not listed lose their rights; the owner is implicit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportACL"
      responses:
        "204":
          description: Replaced.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/mailboxes/{id}/metadata:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/MailboxID"
      - $ref: "#/components/parameters/ImportSessionHeader"
    put:
      operationId: putImportMetadata
      summary: Replace the annotations (METADATA) of a mailbox
      description: |
        Entry names are full (`/shared/comment`, `/private/comment`);
        private entries belong to the account. Entries not listed are
        removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportMetadata"
      responses:
        "204":
          description: Replaced.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/import/sieve:
    parameters:
      - $ref: "#/components/parameters/Account"
      - $ref: "#/components/parameters/ImportSessionHeader"
    put:
      operationId: putImportSieve
      summary: Replace the Sieve scripts and the active script
      description: |
        Stores the scripts as given (nothing is executed), activates
        `active` ("" deactivates) and removes scripts not listed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSieve"
      responses:
        "204":
          description: Replaced.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/accounts/{account}/trace:
    parameters:
      - $ref: "#/components/parameters/Account"
    get:
      operationId: getTrace
      summary: Protocol trace switch of an account
      description: The account must be the canonical account. Requires the role `trace`.
      responses:
        "200":
          description: The current switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceStatus"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setTrace
      summary: Switch the protocol trace on
      description: |
        Switches the protocol trace of the account on for a bounded time
        (the configured default without `duration_seconds`, at most the
        configured maximum). Every server of the cluster traces new
        sessions of the account after their authentication: each protocol
        line of both directions is logged (event `protocol_trace`) with the
        session id; literal contents only by size, long lines cut. Running
        sessions of the account are not affected until they log in again.
        Authentication commands end the trace unlogged; PREVIEW texts are
        masked. The account must be the canonical account. Requires the
        role `trace`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraceRequest"
      responses:
        "200":
          description: The trace is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceStatus"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearTrace
      summary: Switch the protocol trace off
      description: |
        Removes the switch; a traced session stops at its next command once
        the configured recheck interval has passed (an idling session at
        the end of IDLE or when the trace expires). Requires the role
        `trace`.
      responses:
        "204":
          description: Off (or it was not on).
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    Account:
      name: account
      in: path
      required: true
      description: Canonical account.
      schema:
        type: string
        minLength: 1
        maxLength: 320
    MailboxID:
      name: id
      in: path
      required: true
      description: Stable mailbox id.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ImportSessionHeader:
      name: X-Import-Session
      in: header
      required: true
      description: The session that holds the import lock.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{16,64}$"
    Identifier:
      name: identifier
      in: path
      required: true
      description: Canonical account or `anyone`.
      schema:
        type: string
        minLength: 1
        maxLength: 320
    JobID:
      name: job
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    UID:
      name: uid
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 4294967295
    UIDValidity:
      name: uidvalidity
      in: query
      required: true
      description: UIDVALIDITY the UID belongs to.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 4294967295
    ScriptName:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag of the version the change is based on.
      schema:
        type: string
        maxLength: 128
  headers:
    ETag:
      description: Version of the resource (use in If-Match).
      schema:
        type: string
  responses:
    Error:
      description: |
        Failure. `code` is stable: `bad_request` (400), `unauthenticated`
        (401), `forbidden` (403), `no_such_user` and `no_such_mailbox`
        (404), `too_large` (413), `rejected` (422, Sieve reject),
        `over_quota` (507), `temporary` (503, try again), `internal` (500),
        `conflict` (409, imported data contradicts the target),
        `import_locked` (409, another session holds the account),
        `not_locked` (409, the session does not hold the lock),
        `precondition_failed` (412, If-Match does not match),
        `no_such_job` (404, job, plan or learning job), `no_such_message`
        (404), `no_such_script` (404).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, unauthenticated, forbidden, no_such_user, no_such_mailbox, no_such_message, no_such_script, too_large, rejected, over_quota, temporary, internal, conflict, import_locked, not_locked, precondition_failed, no_such_job]
        message:
          type: string
    Version:
      type: object
      required: [version, go_version]
      properties:
        version:
          type: string
        go_version:
          type: string
    DeliveryResult:
      type: object
      required: [account, stored]
      properties:
        account:
          type: string
          description: Canonical account the recipient resolved to.
        stored:
          type: array
          description: Stored copies; empty when Sieve discarded the message.
          items:
            $ref: "#/components/schemas/StoredMessage"
    StoredMessage:
      type: object
      required: [mailbox, uid, guid, size]
      properties:
        mailbox:
          type: string
        uid:
          type: integer
          format: int64
        guid:
          type: string
        size:
          type: integer
          format: int64
    ImportSessionRequest:
      type: object
      properties:
        session:
          type: string
          description: Resume this session (it must hold the lock or the lock must be free); omitted, the server chooses one.
          pattern: "^[A-Za-z0-9_-]{16,64}$"
    ImportSession:
      type: object
      required: [account, session, expires_at]
      properties:
        account:
          type: string
        session:
          type: string
        expires_at:
          type: string
          format: date-time
    ImportMailboxSpec:
      type: object
      required: [name, uidvalidity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        uidvalidity:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
        id:
          type: string
          description: Preferred mailbox id (32 lowercase hex digits, e.g. the Dovecot mailbox GUID).
          maxLength: 64
        special_use:
          type: array
          items:
            type: string
        subscribed:
          type: boolean
        replace:
          type: boolean
          description: |
            Replace an existing mailbox with another UIDVALIDITY even if it
            holds messages (they are removed): the source recreated the
            mailbox and it is imported again.
    ImportMailboxState:
      type: object
      required: [id, name, uidvalidity, uid_next, highest_modseq, subscribed, special_use]
      properties:
        id:
          type: string
        name:
          type: string
        uidvalidity:
          type: integer
          format: int64
        uid_next:
          type: integer
          format: int64
        highest_modseq:
          type: integer
          format: int64
        subscribed:
          type: boolean
        special_use:
          type: array
          items:
            type: string
    ImportMailboxList:
      type: object
      required: [mailboxes]
      properties:
        mailboxes:
          type: array
          items:
            $ref: "#/components/schemas/ImportMailboxState"
    ImportInventoryEntry:
      type: object
      required: [uid, guid, size, modseq, flags]
      properties:
        uid:
          type: integer
          format: int64
        guid:
          type: string
        size:
          type: integer
          format: int64
        modseq:
          type: integer
          format: int64
        flags:
          type: array
          items:
            type: string
    ImportInventory:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ImportInventoryEntry"
        next_after:
          type: integer
          format: int64
    ImportResult:
      type: object
      required: [imported, existing, shared, bytes]
      properties:
        imported:
          type: integer
        existing:
          type: integer
        shared:
          type: integer
        bytes:
          type: integer
          format: int64
    ImportFlagChange:
      type: object
      required: [uid, modseq, flags]
      properties:
        uid:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
        modseq:
          type: integer
          format: int64
          minimum: 0
        flags:
          type: array
          items:
            type: string
    ImportChanges:
      type: object
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/ImportFlagChange"
        expunge:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 4294967295
    ImportFinalize:
      type: object
      required: [uid_next, highest_modseq]
      properties:
        uid_next:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
        highest_modseq:
          type: integer
          format: int64
          minimum: 0
    ImportACL:
      type: object
      required: [entries]
      properties:
        entries:
          type: object
          additionalProperties:
            type: string
    ImportMetadata:
      type: object
      required: [entries]
      properties:
        entries:
          type: object
          additionalProperties:
            type: string
    ImportSieve:
      type: object
      required: [scripts, active]
      properties:
        scripts:
          type: array
          items:
            $ref: "#/components/schemas/ImportSieveScript"
        active:
          type: string
    ImportSieveScript:
      type: object
      required: [name, script]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        script:
          type: string
    TraceRequest:
      type: object
      properties:
        duration_seconds:
          type: integer
          minimum: 1
          description: How long the trace lasts (capped at the configured maximum).
    TraceStatus:
      type: object
      required: [account, active]
      properties:
        account:
          type: string
        active:
          type: boolean
        until:
          type: string
          format: date-time
          description: End of the trace (only while active).
        set_by:
          type: string
          description: Admin principal that switched it on.
        set_at:
          type: string
          format: date-time
    ServerStatus:
      type: object
      required: [version, go_version, instance, started_at, config_fingerprint, store]
      properties:
        version:
          type: string
        go_version:
          type: string
        instance:
          type: string
          description: Host name of the answering server (pod).
        started_at:
          type: string
          format: date-time
        config_fingerprint:
          type: string
          description: SHA-256 over the effective configuration without secret values.
        store:
          $ref: "#/components/schemas/StoreStatus"
    StoreStatus:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
    AccountStatus:
      type: object
      required: [account, lookup, store_exists, mailboxes, quota, import_locked, trace_active]
      properties:
        account:
          type: string
        lookup:
          type: string
          enum: [canonical, alias, unknown, unavailable, public]
          description: |
            Outcome of the Nauthilus lookup of `account`; `public` is the
            public namespace, which has no user database entry.
        canonical_account:
          type: string
        store_exists:
          type: boolean
          description: Whether the store namespace of `account` has mailboxes.
        mailboxes:
          type: integer
        quota:
          $ref: "#/components/schemas/QuotaStatus"
        import_locked:
          type: boolean
        trace_active:
          type: boolean
        trace_until:
          type: string
          format: date-time
    MailboxSummary:
      type: object
      required: [id, name, uidvalidity, uid_next, highest_modseq, shard_size, subscribed, special_use, acl_entries]
      properties:
        id:
          type: string
        name:
          type: string
        uidvalidity:
          type: integer
          format: int64
        uid_next:
          type: integer
          format: int64
        highest_modseq:
          type: integer
          format: int64
        shard_size:
          type: integer
          format: int64
        subscribed:
          type: boolean
        special_use:
          type: array
          items:
            type: string
        acl_entries:
          type: integer
    MailboxPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MailboxSummary"
        next:
          type: string
          description: Pass as `after` for the next page; absent on the last page.
    MailboxDetail:
      type: object
      required: [mailbox, messages, unseen, deleted, size_bytes, shards, log_start, recent_from, keywords]
      properties:
        mailbox:
          $ref: "#/components/schemas/MailboxSummary"
        messages:
          type: integer
          format: int64
        unseen:
          type: integer
          format: int64
        deleted:
          type: integer
          format: int64
        size_bytes:
          type: integer
          format: int64
        shards:
          type: integer
          format: int64
          description: Index shards covering UIDs below uid_next.
        log_start:
          type: integer
          format: int64
          description: Oldest modseq the change log covers (QRESYNC horizon).
        recent_from:
          type: integer
          format: int64
        keywords:
          type: array
          items:
            type: string
    ACLEntry:
      type: object
      required: [identifier, rights]
      properties:
        identifier:
          type: string
        rights:
          type: string
    MailboxACL:
      type: object
      required: [owner, mailbox, generation, entries]
      properties:
        owner:
          type: string
        mailbox:
          type: string
        generation:
          type: integer
          format: int64
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ACLEntry"
    ACLExplanation:
      type: object
      required: [owner, mailbox, principal, lookup, rights, is_owner, own_entry, anyone_entry, visible, pointer, findings]
      properties:
        owner:
          type: string
        mailbox:
          type: string
        principal:
          type: string
        lookup:
          type: string
          enum: [canonical, alias, unknown, unavailable]
        canonical_principal:
          type: string
        rights:
          type: string
          description: Effective rights of the canonical principal.
        is_owner:
          type: boolean
        own_entry:
          type: string
          description: Rights of the principal's own ACL entry ("" if none).
        anyone_entry:
          type: string
        visible:
          type: boolean
          description: The principal can see the mailbox (right l or owner).
        pointer:
          $ref: "#/components/schemas/SharedPointer"
        findings:
          type: array
          items:
            type: string
    SharedPointer:
      type: object
      required: [present]
      properties:
        present:
          type: boolean
        subscribed:
          type: boolean
        generation:
          type: integer
          format: int64
          description: |
            ACL generation of the last pointer write for this principal
            (informational; SETACLs for other identifiers raise the
            mailbox's generation without touching this pointer).
    SharedRef:
      type: object
      required: [owner, mailbox, subscribed, generation]
      properties:
        owner:
          type: string
        mailbox:
          type: string
        subscribed:
          type: boolean
        generation:
          type: integer
          format: int64
    SharedList:
      type: object
      required: [account, items]
      properties:
        account:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/SharedRef"
    QuotaStatus:
      type: object
      required: [usage_bytes, usage_messages, limit_bytes, limit_messages]
      properties:
        usage_bytes:
          type: integer
          format: int64
        usage_messages:
          type: integer
          format: int64
        limit_bytes:
          type: integer
          format: int64
          description: 0 is unlimited.
        limit_messages:
          type: integer
          format: int64
          description: 0 is unlimited.
    MailboxCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        special_use:
          type: array
          items:
            type: string
    MailboxUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        subscribed:
          type: boolean
    ACLChange:
      type: object
      required: [rights]
      properties:
        rights:
          type: string
          maxLength: 32
          description: RFC 4314 rights (c and d expand as usual).
        mode:
          type: string
          enum: [replace, add, remove]
          default: replace
    JobState:
      type: string
      enum: [queued, running, succeeded, partially_failed, failed, cancel_requested, cancelled]
    PlanRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [scrub, quota_recalc, acl_reconcile, fts_rebuild, mailbox_delete, expunge, purge]
        params:
          type: object
          additionalProperties: true
          description: |
            scrub: `classes` (deliveries, moves, retired, uncovered, entries,
            refs, orphans, unknown, quota; empty = all); mailbox_delete:
            `mailbox_id`; expunge: `mailbox_id` and `uids` (list) or
            `deleted: true` (every message flagged \Deleted when planned).
    Plan:
      type: object
      required: [id, kind, account, summary, principal, created, expires]
      properties:
        id:
          type: string
        kind:
          type: string
        account:
          type: string
        params:
          type: object
          additionalProperties: true
        summary:
          type: object
          additionalProperties: true
          description: What the job would do (kind-specific).
        principal:
          type: string
        created:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
        applied_job:
          type: string
    JobRequest:
      type: object
      properties:
        plan_id:
          type: string
          maxLength: 64
        kind:
          type: string
          enum: [index_check]
        account:
          type: string
          maxLength: 320
    JobProgress:
      type: object
      required: [done, total]
      properties:
        phase:
          type: string
        done:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    Job:
      type: object
      required: [id, kind, account, state, principal, created, progress, attempts, errors]
      properties:
        id:
          type: string
        kind:
          type: string
        account:
          type: string
        plan_id:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        principal:
          type: string
        created:
          type: string
          format: date-time
        started:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
        progress:
          $ref: "#/components/schemas/JobProgress"
        result:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            type: string
        attempts:
          type: integer
        server:
          type: string
          description: The server holding (or last holding) the job.
    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next:
          type: string
    MessageMeta:
      type: object
      required: [uid, guid, size, flags, internal_date, modseq]
      properties:
        uid:
          type: integer
          format: int64
        guid:
          type: string
        size:
          type: integer
          format: int64
        flags:
          type: array
          items:
            type: string
        internal_date:
          type: string
          format: date-time
        modseq:
          type: integer
          format: int64
    MessagePage:
      type: object
      required: [uidvalidity, items]
      properties:
        uidvalidity:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageMeta"
        next_uid:
          type: integer
          format: int64
          description: Continue with after_uid=next_uid.
    MessageEnvelope:
      type: object
      required: [subject, from, to, cc, message_id]
      properties:
        date:
          type: string
          format: date-time
        subject:
          type: string
        from:
          type: array
          items:
            type: string
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        message_id:
          type: string
    MessageDetail:
      type: object
      required: [mailbox_id, uidvalidity, message, header]
      properties:
        mailbox_id:
          type: string
        uidvalidity:
          type: integer
          format: int64
        message:
          $ref: "#/components/schemas/MessageMeta"
        envelope:
          $ref: "#/components/schemas/MessageEnvelope"
        header:
          type: string
          description: The header section as stored (at most 64 KiB).
    FlagRequest:
      type: object
      required: [uidvalidity, uids]
      properties:
        uidvalidity:
          type: integer
          format: int64
        uids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            format: int64
        add:
          type: array
          items:
            type: string
        remove:
          type: array
          items:
            type: string
        unchanged_since:
          type: integer
          format: int64
    FlagResult:
      type: object
      required: [updated, modified, missing]
      properties:
        updated:
          type: array
          items:
            $ref: "#/components/schemas/MessageMeta"
        modified:
          type: array
          description: UIDs skipped because of unchanged_since.
          items:
            type: integer
            format: int64
        missing:
          type: array
          items:
            type: integer
            format: int64
    CopyRequest:
      type: object
      required: [uidvalidity, uids, destination_id]
      properties:
        uidvalidity:
          type: integer
          format: int64
        uids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            format: int64
        destination_id:
          type: string
          maxLength: 64
        move:
          type: boolean
          default: false
    CopyResult:
      type: object
      required: [destination_id, destination_uidvalidity, copied, missing]
      properties:
        destination_id:
          type: string
        destination_uidvalidity:
          type: integer
          format: int64
        copied:
          type: array
          items:
            $ref: "#/components/schemas/CopiedMessage"
        missing:
          type: array
          items:
            type: integer
            format: int64
    CopiedMessage:
      type: object
      required: [uid, new_uid]
      properties:
        uid:
          type: integer
          format: int64
        new_uid:
          type: integer
          format: int64
    MessageSearch:
      type: object
      properties:
        mailbox_id:
          type: string
          maxLength: 64
        from:
          type: string
          maxLength: 256
        to:
          type: string
          maxLength: 256
        subject:
          type: string
          maxLength: 256
        message_id:
          type: string
          maxLength: 256
        text:
          type: string
          maxLength: 256
        since:
          type: string
          format: date-time
        before:
          type: string
          format: date-time
        min_size:
          type: integer
          format: int64
        max_size:
          type: integer
          format: int64
        flags:
          type: array
          description: All of these flags are set.
          items:
            type: string
        not_flags:
          type: array
          description: None of these flags is set.
          items:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        after:
          type: string
          maxLength: 128
          description: The `next` of the previous page.
    SearchHit:
      type: object
      required: [mailbox_id, mailbox, uidvalidity, message]
      properties:
        mailbox_id:
          type: string
        mailbox:
          type: string
        uidvalidity:
          type: integer
          format: int64
        message:
          $ref: "#/components/schemas/MessageMeta"
        envelope:
          $ref: "#/components/schemas/MessageEnvelope"
    SearchResult:
      type: object
      required: [items, scanned]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        scanned:
          type: integer
          format: int64
        next:
          type: string
          description: Set when the search stopped early (limit or scan limit).
    SieveScriptInfo:
      type: object
      required: [name, active, size, etag]
      properties:
        name:
          type: string
        active:
          type: boolean
        size:
          type: integer
          format: int64
        etag:
          type: string
    SieveList:
      type: object
      required: [scripts]
      properties:
        active:
          type: string
        scripts:
          type: array
          items:
            $ref: "#/components/schemas/SieveScriptInfo"
    SieveScript:
      type: object
      required: [name, active, script, etag]
      properties:
        name:
          type: string
        active:
          type: boolean
        script:
          type: string
        etag:
          type: string
    SievePut:
      type: object
      required: [script]
      properties:
        script:
          type: string
          maxLength: 1048576
        activate:
          type: boolean
          default: false
    SieveActivate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
    SieveMessageRef:
      type: object
      required: [mailbox_id, uidvalidity, uid]
      properties:
        mailbox_id:
          type: string
          maxLength: 64
        uidvalidity:
          type: integer
          format: int64
        uid:
          type: integer
          format: int64
    SieveCheck:
      type: object
      properties:
        script:
          type: string
          maxLength: 1048576
          description: Script text; without it the stored `name`, or the active script.
        name:
          type: string
          maxLength: 128
        message:
          $ref: "#/components/schemas/SieveMessageRef"
        raw:
          type: string
          maxLength: 1048576
          description: A test message (instead of `message`).
        envelope_from:
          type: string
          maxLength: 320
        envelope_to:
          type: string
          maxLength: 320
    SieveCheckResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        error:
          type: string
        actions:
          $ref: "#/components/schemas/SieveActions"
    SieveActions:
      type: object
      required: [keep, fileinto, redirect, notify, programs, suppressed]
      properties:
        keep:
          type: boolean
          description: The message would be stored in INBOX (implicit or explicit keep).
        fileinto:
          type: array
          items:
            $ref: "#/components/schemas/SieveFileInto"
        discard:
          type: boolean
        reject:
          type: string
        redirect:
          type: array
          items:
            type: string
        vacation:
          $ref: "#/components/schemas/SieveVacation"
        notify:
          type: array
          items:
            type: string
        programs:
          type: array
          items:
            type: string
        header_edited:
          type: boolean
        suppressed:
          type: array
          description: Side effects that were not carried out.
          items:
            type: string
    SieveFileInto:
      type: object
      required: [mailbox, flags]
      properties:
        mailbox:
          type: string
        flags:
          type: array
          items:
            type: string
    SieveVacation:
      type: object
      required: [subject, days]
      properties:
        subject:
          type: string
        from:
          type: string
        days:
          type: integer
    LearningState:
      type: string
      enum: [pending, dead, delivered]
    LearningJob:
      type: object
      required: [id, account, mailbox_id, program, state, attempts, created, next_attempt, size, retries]
      properties:
        id:
          type: string
        account:
          type: string
        mailbox_id:
          type: string
        program:
          type: string
        state:
          $ref: "#/components/schemas/LearningState"
        prepared:
          type: boolean
          description: Waits for the receipt of the stored message.
        attempts:
          type: integer
        retries:
          type: integer
          description: Manual retries so far.
        created:
          type: string
          format: date-time
        next_attempt:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
    LearningPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LearningJob"
        next:
          type: string
    LearningRetry:
      type: object
      properties:
        confirm_repeat:
          type: boolean
          default: false
