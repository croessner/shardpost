# Test directory for hack/quota-flag-ldap-test.sh, shaped like the
# provider: RNS mail schema, LDAPS with client certificates, SASL EXTERNAL
# mapped by authz-regexp, and an ACL that lets the quota identity write
# rnsMSOverQuota and nothing else (the proposal for the provider).
include /etc/openldap/openldap/schema/core.schema
include /etc/openldap/openldap/schema/cosine.schema
include /etc/openldap/openldap/schema/nis.schema
include /etc/openldap/openldap/schema/inetorgperson.schema
include /etc/openldap/custom-schema/rnsmailsystem.schema

pidfile /var/run/openldap/slapd.pid
argsfile /var/run/openldap/slapd.args

modulepath /usr/lib/openldap/openldap
moduleload back_mdb.la

TLSCACertificateFile /etc/openldap/tls/ca.crt
TLSCertificateFile /etc/openldap/tls/ldap.crt
TLSCertificateKeyFile /etc/openldap/tls/ldap.key
TLSVerifyClient try

authz-regexp "^cn=shardpost-quota$" "cn=shardpost-quota,ou=people,ou=it,dc=roessner-net,dc=de"

database mdb
suffix "dc=roessner-net,dc=de"
rootdn "cn=admin,dc=roessner-net,dc=de"
rootpw synthetic-admin
directory /var/lib/openldap/openldap-data

access to attrs=rnsMSOverQuota
        by dn.exact="cn=shardpost-quota,ou=people,ou=it,dc=roessner-net,dc=de" write
        by users read
access to *
        by users read
        by anonymous auth
