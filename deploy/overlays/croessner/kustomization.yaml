apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: docker.io/chrroessner/shardpost
    newTag: 0.52.0
    digest: sha256:c7878bd2f63361f8c5ccbc1c603955020d4df15e2179271045019b715c94acbd
  - name: docker.io/chrroessner/shardpost-tools
    newTag: 0.13.0
    digest: sha256:68323de9ec7403ee1c3d54bc3fc698cc4511f8431a494b40cb8911127642f3f3
# test-profile: small index shards so the sharding path is exercised with a few
# dozen messages. Production: 100000 (the default).
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: shardpost-server
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: http://192.168.0.102:4318
                  - name: OTEL_EXPORTER_OTLP_PROTOCOL
                    value: http/protobuf
                  - name: OTEL_TRACES_SAMPLER_ARG
                    value: "0.1"
                  - name: MBOX_SHARD_SIZE
                    value: "20"
  - patch: |
      apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      metadata:
        name: shardpost-data
      spec:
        # Preserve immutable EC profile; crush_rule selects the 200 GB OSDs.
        deviceClass: hdd
        enableCrushUpdates: false
        parameters:
          crush_rule: shardpost-data-200gb
  - patch: |
      apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      metadata:
        name: shardpost-index
      spec:
        # Existing class of OSD 3/4/5: 200 GB each, one per host.
        deviceClass: rgw
        enableCrushUpdates: false
        parameters:
          crush_rule: shardpost-index-200gb
  # The system pool on the OSDs of the index pool: this cluster tests the
  # mechanism, not a separation of the hardware. Prepared only; the
  # servers keep CEPH_SYSTEM_POOL empty until the migration.
  - patch: |
      apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      metadata:
        name: shardpost-system
      spec:
        deviceClass: rgw
        enableCrushUpdates: false
        parameters:
          crush_rule: shardpost-index-200gb
          pg_num_min: "16"
