# The croessner overlay with Nauthilus authentication and the director
# master user. Apply this instead of ../croessner once the two Secrets
# named in ../../components/nauthilus exist in the namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../croessner
  - network-policy.yaml
  - jmap.yaml
components:
  - ../../components/nauthilus
  - ../../components/quota-ldap-renew
  - ../../components/admin-mtls
  - ../../components/import-sidecar
  - ../../components/jmap-push
# Pinned here as well: the import sidecar of the component above is added
# after ../croessner has pinned its images.
images:
  - name: docker.io/chrroessner/shardpost
    newTag: 0.52.0
    digest: sha256:c7878bd2f63361f8c5ccbc1c603955020d4df15e2179271045019b715c94acbd
configMapGenerator:
  - name: shardpost-server-config
    namespace: shardpost
    files:
      - server.yaml
  # Scripts that run after every account's own Sieve script (sieve.after_dir).
  - name: shardpost-sieve-after
    namespace: shardpost
    files:
      - sieve-after/50-public-folders.sieve
patches:
  # System pool (B11, 0.51.0): the store-wide namespaces moved to
  # shardpost-system on 2026-10-02 (run 00720635caff). The server reads it
  # from server.yaml; the push worker and the scrub CronJob take it from the
  # environment, which wins over server.yaml.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: shardpost-push
        namespace: shardpost
      spec:
        template:
          spec:
            containers:
              - name: push
                env:
                  - name: CEPH_SYSTEM_POOL
                    value: shardpost-system
  - patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: shardpost-scrub
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: scrub
                    env:
                      - name: CEPH_SYSTEM_POOL
                        value: shardpost-system
  - path: configuration-patch.json
