# JMAP behind nauthilus-director. HAProxy on lbr1/lbr2 sends
# mail.roessner-net.de /jmap/ and /.well-known/jmap to the director, which
# authenticates, routes by mailShard and connects here with PROXY v2 and TLS
# (internal CA, shardpost.shardpost.svc.cluster.local, as for IMAP).
apiVersion: v1
kind: Service
metadata:
  name: shardpost-jmap
  namespace: shardpost
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shardpost-server
  ports:
    - name: jmap
      port: 9443
      targetPort: jmap
