# JMAP push subscriptions (RFC 8620 7.2) with Web Push: the push worker
# ("shardpost push", one replica) and the VAPID key the front-ends
# advertise. The event source needs none of this.
#
# Requires a Secret in the namespace, created once outside git:
#   shardpost-jmap-vapid   key vapid.pem: a P-256 private key in PEM, e.g.
#                          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt
# Rotating it invalidates every subscription (RFC 9749 5).
#
# The worker posts to push services on the Internet (HTTPS): a network
# policy that limits egress has to let it out.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - deployment.yaml
patches:
  - path: server-patch.yaml
    target:
      kind: Deployment
      name: shardpost-server
