apiVersion: apps/v1
kind: Deployment
metadata:
  name: shardpost-server
  namespace: shardpost
spec:
  template:
    spec:
      containers:
        # Runs as the pod user (167), the only UID the admin socket admits.
        # Start a run with
        #   kubectl -n shardpost exec deploy/shardpost-server -c import -- \
        #     shardpostctl migrate <account>
        # (see docs/admin-api.md for detached runs and the cutover order).
        - name: import
          image: docker.io/chrroessner/shardpost:0.24.0
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          env:
            - name: SHARDPOST_ADMIN_SOCKET
              value: /run/shardpost/admin.sock
            - name: SHARDPOST_MIGRATE_SOURCE_ADDR
              value: "192.168.0.2:993"
            - name: SHARDPOST_MIGRATE_SOURCE_TLS
              value: implicit
            - name: SHARDPOST_MIGRATE_SOURCE_SERVER_NAME
              value: mail.roessner-net.de
            - name: SHARDPOST_MIGRATE_MASTER_USER
              value: nauthilus-director
            - name: SHARDPOST_MIGRATE_PASSWORD_FILE
              value: /secrets/migrate-source/password
            # ManageSieve of mailstack1 (director backend mailstack1-sieve):
            # STARTTLS behind the load balancer, PROXY header required.
            - name: SHARDPOST_MIGRATE_SIEVE_ADDR
              value: "192.168.0.2:34190"
            - name: SHARDPOST_MIGRATE_SIEVE_TLS
              value: starttls
            - name: SHARDPOST_MIGRATE_SIEVE_SERVER_NAME
              value: mail.roessner-net.de
            - name: SHARDPOST_MIGRATE_SIEVE_PROXY
              value: "true"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: admin-socket
              mountPath: /run/shardpost
            - name: migrate-source
              mountPath: /secrets/migrate-source
              readOnly: true
            - name: import-work
              mountPath: /work
      volumes:
        - name: migrate-source
          secret:
            secretName: shardpost-migrate-source
            defaultMode: 0440
            optional: true
        - name: import-work
          emptyDir:
            sizeLimit: 64Mi
