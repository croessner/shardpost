apiVersion: v1
kind: ServiceAccount
metadata:
  name: shardpost-quota-ldap-renew
  namespace: shardpost
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shardpost-quota-ldap-renew
  namespace: shardpost
rules:
  # Exactly the one Secret; it must exist (create cannot be scoped by name).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["shardpost-quota-ldap"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shardpost-quota-ldap-renew
  namespace: shardpost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shardpost-quota-ldap-renew
subjects:
  - kind: ServiceAccount
    name: shardpost-quota-ldap-renew
    namespace: shardpost
