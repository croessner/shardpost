# TLS for the test-profile listeners (STARTTLS on 143/24/4190, implicit TLS on
# 993/995). A namespace-local CA is bootstrapped with cert-manager so that
# clients inside the cluster (nauthilus-director) can verify the server
# certificate against a CA file instead of skipping verification. The CA
# certificate is exported from secret shardpost-ca (key ca.crt); the server
# only needs tls.crt/tls.key.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: shardpost-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shardpost-ca
spec:
  isCA: true
  commonName: shardpost-ca
  secretName: shardpost-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: shardpost-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: shardpost-ca
spec:
  ca:
    secretName: shardpost-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shardpost-tls
spec:
  secretName: shardpost-tls
  duration: 2160h
  renewBefore: 360h
  commonName: shardpost.shardpost.svc.cluster.local
  dnsNames:
    - shardpost
    - shardpost.shardpost.svc
    - shardpost.shardpost.svc.cluster.local
  issuerRef:
    name: shardpost-ca
    kind: Issuer
